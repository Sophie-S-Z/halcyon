<title>Halcyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap">
<style>
/* Layout: one full-bleed canvas. The threshold, the title, and the three controls float above it. */
:root {
  --ink: #1A1410;
  --umber: #3B2A20;
  --bark: #6B4E3D;
  --clay: #B9805F;
  --peach: #D9A383;
  --gold: #C9A35B;
  --paper: #EFE3CF;
  --tide: #5E7F80;
  --paper-80: rgba(239, 227, 207, 0.8);
  --paper-40: rgba(239, 227, 207, 0.4);
  --paper-15: rgba(239, 227, 207, 0.15);
  --serif: "Cormorant Garamond", "Cormorant", "EB Garamond", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.45, 0, 0.25, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--paper-80);
  font-family: var(--serif);
  font-weight: 300;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

/* ---------- threshold ---------- */
#threshold {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
  background: var(--ink);
  touch-action: none; cursor: default; outline: none;
}
#threshold.open { background: transparent; pointer-events: none; }
#threshold:focus-visible .word { color: var(--paper-80); }
.light { position: relative; width: 120px; height: 120px; display: grid; place-items: center; will-change: transform; }
.light .swell { position: absolute; inset: 0; display: grid; place-items: center; animation: swell 10s ease-in-out infinite; }
.light .halo {
  position: absolute; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201, 163, 91, 0.55) 0%, rgba(201, 163, 91, 0.18) 38%, rgba(201, 163, 91, 0) 70%);
  will-change: transform, opacity;
}
.light .core {
  width: 18px; height: 18px; border-radius: 50%;
  background: #EFD9A8;
  box-shadow: 0 0 24px 8px rgba(201, 163, 91, 0.6);
  will-change: transform, opacity;
}
@keyframes swell { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
#threshold .word {
  font-size: 22px; letter-spacing: 0.12em; color: var(--paper-40);
  transition: color 2s var(--ease);
}

/* ---------- rest light (timer end, sleep fade) ---------- */
#restlight {
  position: fixed; left: 50%; top: 50%; z-index: 15; translate: -50% -50%;
  opacity: 0; pointer-events: none; transition: opacity 4s var(--ease);
}
#restlight.on { opacity: 1; }

/* ---------- scene title ---------- */
#title {
  position: fixed; left: 0; right: 0; top: 26%; z-index: 10;
  text-align: center; pointer-events: none;
  font-size: clamp(22px, 2.6vw, 32px); letter-spacing: 0.12em;
  color: var(--paper-80);
  text-shadow: 0 0 18px rgba(26, 20, 16, 0.55), 0 0 2px rgba(26, 20, 16, 0.4);
  opacity: 0;
}
#title.night { color: var(--gold); }

/* ---------- hold cue on the shore ---------- */
#holdcue {
  position: fixed; z-index: 9; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
  background: radial-gradient(circle, rgba(240, 201, 122, 0.55) 0%, rgba(201, 163, 91, 0) 65%);
  opacity: 0; transform: scale(0.2); pointer-events: none;
}

/* ---------- controls ---------- */
#controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
  padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  opacity: 0; visibility: hidden;
  transition: opacity 0.6s var(--ease), visibility 0s linear 0.6s;
  pointer-events: none;
}
#controls.show { opacity: 1; visibility: visible; transition: opacity 0.6s var(--ease), visibility 0s; }
#controls > * { pointer-events: auto; }
.icons { display: flex; gap: 28px; opacity: 0.7; }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center;
  background: none; border: 0; padding: 0; border-radius: 50%; color: var(--paper); cursor: pointer;
  transition: background-color 0.6s var(--ease);
}
.icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
.icon:hover, .icon[aria-expanded="true"] { background: var(--paper-15); }
.icon:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }

#arc { width: min(520px, 100%); }
#arc svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; cursor: pointer; }
#arc .track { fill: none; stroke: var(--paper-40); stroke-width: 1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
#arc .hit { fill: none; stroke: transparent; stroke-width: 40; }
#arc .end { fill: none; stroke: var(--paper-40); stroke-width: 1; vector-effect: non-scaling-stroke; }
#arc .dot { fill: var(--gold); }
#arc .dotglow { fill: rgba(201, 163, 91, 0.25); }
#arc svg:focus-visible { outline: none; }
#arc svg:focus-visible .dotglow { fill: rgba(201, 163, 91, 0.5); }

#panel {
  width: min(340px, 100%); box-sizing: border-box;
  padding: 18px 20px; border-radius: 6px;
  background: rgba(26, 20, 16, 0.72);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px 18px;
  font-size: 17px; letter-spacing: 0.1em; color: var(--paper-80);
}
#panel .lab { color: var(--paper-40); }
#panel .seg { display: flex; gap: 2px; justify-content: flex-end; }
#panel button {
  font: inherit; letter-spacing: 0.06em; color: var(--paper-80);
  background: none; border: 1px solid transparent; border-radius: 14px;
  padding: 2px 8px; cursor: pointer; font-variant-numeric: tabular-nums;
}
#panel button[aria-pressed="true"] { border-color: var(--gold); color: var(--paper); }
#panel button:focus-visible { outline: 1px solid var(--gold); outline-offset: 1px; }
#panel .sw { justify-self: end; }
#volume { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
#volume::-webkit-slider-runnable-track { height: 1px; background: var(--paper-40); }
#volume::-moz-range-track { height: 1px; background: var(--paper-40); }
#volume::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--gold); border: 0; }
#volume::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); border: 0; }
#volume:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

#loading {
  position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 21;
  text-align: center; font-size: 15px; letter-spacing: 0.12em; color: var(--paper-40);
  transition: opacity 2s var(--ease);
}
#loading.gone { opacity: 0; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .light .swell { animation-duration: 14s; }
}

/* ---------- gallery: living windows on a dark field ---------- */
#gallery {
  position: fixed; inset: 0; z-index: 8; overflow: hidden;
  background: var(--ink); touch-action: none; cursor: grab;
  opacity: 0; transition: opacity 1.2s var(--ease);
}
#gallery.on { opacity: 1; }
#gallery.dragging { cursor: grabbing; }
#field { position: absolute; left: 50%; top: 50%; width: 0; height: 0; will-change: transform; }
.win {
  position: absolute; display: block; padding: 0; border: 0; background: none; cursor: pointer;
  width: var(--w); aspect-ratio: 3 / 2; margin: calc(var(--w) / -3) 0 0 calc(var(--w) / -2);
  color: inherit; font: inherit; outline: none;
  animation: drift var(--dur, 26s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}
.win .art {
  position: absolute; inset: 0; overflow: hidden; border-radius: 6px;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
          mask-composite: intersect;
  filter: brightness(0.62) saturate(0.85);
  transition: filter 2s var(--ease);
}
.win .art svg { display: block; width: 100%; height: 100%; }
.win:hover .art, .win:focus-visible .art, .win.lit .art { filter: brightness(1) saturate(1); }
.win .wt {
  position: absolute; left: 0; right: 0; top: calc(100% + 10px); text-align: center;
  font-size: 19px; letter-spacing: 0.12em; color: var(--paper-80); opacity: 0;
  transition: opacity 2s var(--ease); pointer-events: none;
}
.win:hover .wt, .win:focus-visible .wt, .win.lit .wt { opacity: 0.8; }
.win:focus-visible .art { box-shadow: 0 0 0 1px var(--gold); }
.win.unlit { cursor: default; pointer-events: none; }
.win.unlit .art { filter: none; background: radial-gradient(ellipse at 50% 55%, rgba(201, 163, 91, 0.07), rgba(201, 163, 91, 0) 70%); }
.win.unlit .art::after { content: ""; position: absolute; inset: 18%; border-radius: 4px; border: 1px solid rgba(239, 227, 207, 0.05); }
@keyframes drift { from { transform: translate(-6px, -4px); } to { transform: translate(7px, 5px); } }
@media (prefers-reduced-motion: reduce) { .win { animation: none; } }
</style>

<div id="stage" aria-hidden="false"></div>

<div id="threshold" role="button" tabindex="0" aria-label="halcyon. press and hold for one slow breath, then let go to enter.">
  <div class="light" id="tlight">
    <div class="swell"><div class="halo" id="thalo"></div><div class="core" id="tcore"></div></div>
  </div>
  <div class="word" aria-hidden="true">halcyon</div>
</div>
<div id="loading" aria-hidden="true"></div>

<div id="restlight" aria-hidden="true">
  <div class="light"><div class="swell"><div class="halo"></div><div class="core"></div></div></div>
</div>

<div id="gallery" hidden role="group" aria-label="gallery"><div id="field"></div></div>
<div id="title" aria-live="polite"></div>
<div id="holdcue" aria-hidden="true"></div>

<div id="controls">
  <div id="panel" hidden role="group" aria-label="rest">
    <span class="lab" id="lab-vol">volume</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-labelledby="lab-vol">
    <span class="lab">timer</span>
    <div class="seg" id="timer" role="group" aria-label="timer">
      <button type="button" data-min="0" aria-pressed="true">off</button>
      <button type="button" data-min="5" aria-pressed="false">5</button>
      <button type="button" data-min="10" aria-pressed="false">10</button>
      <button type="button" data-min="20" aria-pressed="false">20</button>
      <button type="button" data-min="40" aria-pressed="false">40</button>
    </div>
    <span class="lab">haptics</span>
    <button type="button" class="sw" id="sw-haptics" aria-pressed="true">on</button>
    <span class="lab">still</span>
    <button type="button" class="sw" id="sw-still" aria-pressed="false">off</button>
  </div>

  <div id="arc" hidden>
    <svg id="arcsvg" viewBox="0 0 520 112" role="slider" tabindex="0" aria-label="hour" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" aria-valuetext="golden hour">
      <path class="hit" id="archit" d=""></path>
      <path class="track" id="arctrack" d=""></path>
      <circle class="end" cx="20" cy="104" r="3.5"></circle>
      <path class="end" d="M503 99.5a5 5 0 1 0 0 9a4 4 0 0 1 0 -9z"></path>
      <circle class="dotglow" id="arcglow" r="13" cx="0" cy="0"></circle>
      <circle class="dot" id="arcdot" r="5" cx="0" cy="0"></circle>
    </svg>
  </div>

  <div class="icons">
    <button type="button" class="icon" id="b-back" aria-label="back">
      <svg viewBox="0 0 32 32"><rect x="7" y="6" width="18" height="20" rx="3"></rect><path d="M19 16H12M15 13l-3 3 3 3"></path></svg>
    </button>
    <button type="button" class="icon" id="b-hour" aria-label="hour" aria-expanded="false" aria-controls="arc">
      <svg viewBox="0 0 32 32"><path d="M5 22a11 11 0 0 1 22 0"></path><circle cx="21" cy="13.5" r="2" fill="currentColor"></circle><path d="M3 25h26"></path></svg>
    </button>
    <button type="button" class="icon" id="b-rest" aria-label="rest" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 32 32"><path d="M20 6a10 10 0 1 0 6 16A8 8 0 0 1 20 6z"></path></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.min.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.min.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three/webgpu';
import * as TSL from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { dof } from 'three/addons/tsl/display/DepthOfFieldNode.js';

/* =====================================================================
   Halcyon engine. Shared by every scene.
   three.js WebGPURenderer + TSL (automatic WebGL 2 fallback), Tone.js sound.
   Values come from halcyon-design-spec.md. Search "SPEC" for each one.
   A scene is a module that calls E.defineScene({...}). See SCENE API below.
   ===================================================================== */

const {
  Fn, uniform, float, vec2, vec3, vec4, screenUV, pass, renderOutput,
  mix, smoothstep, pow, exp, max, min, clamp, step, floor, fract, sin, asin, atan2,
  length, normalize, dot, positionWorld, cameraPosition, uv, attribute
} = TSL;

const $ = (id) => document.getElementById(id);
const clamp1 = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp1((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const rand = (a, b) => a + Math.random() * (b - a);
const seeded = (seed) => { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; };
const DEG = Math.PI / 180;

/* ---------- device storage (settings only, SPEC: privacy by default) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('halcyon.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('halcyon.' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotionQuery = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const settings = {
  volume: store.get('volume', 0.8),
  haptics: store.get('haptics', true),
  still: store.get('still', reduceMotionQuery.matches)
};

/* =====================================================================
   Renderer, camera, shared TSL noise
   ===================================================================== */
const renderer = new THREE.WebGPURenderer({ antialias: true, powerPreference: 'high-performance', forceWebGL: location.hash === '#webgl' });
try { await renderer.init(); } catch (e) { $('loading').textContent = 'this browser cannot draw the scenes'; throw e; }
const BACKEND = renderer.backend && renderer.backend.isWebGPUBackend ? 'webgpu' : 'webgl2';
document.documentElement.dataset.backend = BACKEND;
renderer.setClearColor(0x1a1410, 1);
renderer.toneMapping = THREE.NoToneMapping;
$('stage').appendChild(renderer.domElement);
const canvas = renderer.domElement;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', 'halcyon');
canvas.tabIndex = -1;

const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 1200);
camera.rotation.order = 'YXZ';
const CAM = { x: 0, y: 0.55, z: 6, pitch: -1.2 * DEG };

const hash12 = Fn(([p]) => {
  const p3 = fract(vec3(p.x, p.y, p.x).mul(0.1031)).toVar();
  p3.addAssign(dot(p3, p3.yzx.add(33.33)));
  return fract(p3.x.add(p3.y).mul(p3.z));
}).setLayout({ name: 'hash12', type: 'float', inputs: [{ name: 'p', type: 'vec2' }] });
const vnoise = Fn(([p]) => {
  const i = floor(p), f = fract(p);
  const u = f.mul(f).mul(f.mul(-2).add(3));
  const a = hash12(i), b = hash12(i.add(vec2(1, 0))), c = hash12(i.add(vec2(0, 1))), d = hash12(i.add(vec2(1, 1)));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}).setLayout({ name: 'vnoise', type: 'float', inputs: [{ name: 'p', type: 'vec2' }] });
const fbm = Fn(([p0]) => {
  const p = vec2(p0).toVar(), s = float(0).toVar();
  let a = 0.5;
  for (let k = 0; k < 4; k++) { s.addAssign(vnoise(p).mul(a)); p.assign(p.mul(2.03).add(vec2(1.7, 9.2))); a *= 0.5; }
  return s;
}).setLayout({ name: 'fbm', type: 'float', inputs: [{ name: 'p', type: 'vec2' }] });
const uTime = uniform(0);

/* =====================================================================
   Hour palettes. A scene gives stops; makeEnv() blends them and feeds uniforms.
   Stop fields: t, top, hor, glow, sun, cloudCol, fog, sunEl, sunAz, moonEl, moonAz,
   star, cloud, mist, light, sunVis, plus any extra colour or number the scene wants.
   ===================================================================== */
function makeEnv(stops) {
  const colorKeys = [], numKeys = [];
  for (const k of Object.keys(stops[0])) { if (k === 't') continue; (typeof stops[0][k] === 'string' ? colorKeys : numKeys).push(k); }
  for (const s of stops) for (const k of colorKeys) s[k] = new THREE.Color(s[k]);
  const env = { sunDir: new THREE.Vector3(), moonDir: new THREE.Vector3(), moon: 0, night: 0 };
  for (const k of colorKeys) env[k] = new THREE.Color();
  const U = {};
  for (const k of colorKeys) U[k] = uniform(env[k]);
  for (const k of numKeys) U[k] = uniform(0);
  U.sunDir = uniform(env.sunDir); U.moonDir = uniform(env.moonDir); U.moon = uniform(0); U.night = uniform(0);
  const dirFrom = (az, el, out) => out.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
  function sample(h) {
    let i = 0; while (i < stops.length - 2 && h > stops[i + 1].t) i++;
    const a = stops[i], b = stops[i + 1];
    const t = easeIO(clamp1((h - a.t) / (b.t - a.t), 0, 1));
    for (const k of colorKeys) env[k].copy(a[k]).lerp(b[k], t);
    for (const k of numKeys) { env[k] = lerp(a[k], b[k], t); U[k].value = env[k]; }
    dirFrom((env.sunAz ?? 0.24), (env.sunEl ?? 10) * DEG, env.sunDir);
    dirFrom((env.moonAz ?? -0.16), (env.moonEl ?? -20) * DEG, env.moonDir);
    env.moon = smooth(-2, 4, env.moonEl ?? -20); U.moon.value = env.moon;
    env.night = smooth(0.66, 0.84, h); U.night.value = env.night;
    return env;
  }
  sample(stops[0].t);
  return { env, U, sample };
}

/* Painted sky dome. Needs U from makeEnv with: top, hor, glow, sun, cloudCol, fog, sunVis, star, cloud, mist. */
function makeSky(U, opts = {}) {
  const starScale = opts.starScale ?? 62, starDensity = opts.starDensity ?? 0.968;
  const mat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false });
  mat.fog = false;
  mat.colorNode = Fn(() => {
    const d = normalize(positionWorld.sub(cameraPosition));
    const el = d.y;
    const az = atan2(d.x, d.z.negate());
    const col = mix(U.hor, U.top, pow(smoothstep(-0.02, 0.42, el), 0.7)).toVar();
    const sd = max(dot(d, U.sunDir), 0);
    col.addAssign(U.glow.mul(pow(sd, 16).mul(0.32).add(pow(sd, 220).mul(0.55))).mul(U.sunVis));
    const above = smoothstep(-0.004, 0.006, el);
    col.assign(mix(col, U.sun.mul(2.4), smoothstep(0.99955, 0.99975, sd).mul(above).mul(U.sunVis)));
    const md = max(dot(d, U.moonDir), 0);
    col.addAssign(vec3(0.55, 0.62, 0.62).mul(pow(md, 30).mul(0.18).add(pow(md, 400).mul(0.25))).mul(U.moon));
    col.assign(mix(col, vec3(1.7, 1.75, 1.7), smoothstep(0.99985, 0.99992, md).mul(above).mul(U.moon)));
    const sc = vec2(az, asin(clamp(el, -1, 1))).mul(starScale);
    const cell = floor(sc);
    const h = hash12(cell);
    const off = vec2(hash12(cell.add(3.1)), hash12(cell.add(7.7))).mul(0.6).add(0.2);
    const sdist = length(fract(sc).sub(off));
    const tw = sin(uTime.mul(h.mul(0.5).add(0.25)).add(h.mul(40))).mul(0.45).add(0.55);
    const star = step(starDensity, h).mul(smoothstep(0.09, 0.0, sdist)).mul(tw).mul(smoothstep(0.02, 0.2, el));
    col.addAssign(vec3(0.95, 0.9, 0.8).mul(star).mul(U.star).mul(h.mul(2).add(0.6)));
    if (opts.milkyWay) {   // a faint band of stars across the sky
      const band = exp(d.y.sub(d.x.mul(0.55)).sub(0.32).mul(d.y.sub(d.x.mul(0.55)).sub(0.32)).mul(-26));
      const mw = fbm(vec2(az.mul(7), el.mul(9)).add(3.3)).mul(band).mul(smoothstep(0.05, 0.3, el));
      col.addAssign(vec3(0.42, 0.44, 0.46).mul(mw).mul(U.star).mul(0.35));

      g.add(st, eye); g.rotation.set(s * -0.35, 0, -0.55); snail.add(g); stalks.push(g);
    }
    snail.userData.stalks = stalks; snail.scale.setScalar(1.15); scene.add(snail);
  }
  const SN = { state: 'out', t0: -99, k: 1, a: 1.45 };
  function touchSnail() {
    if (SN.state !== 'out' && SN.state !== 'coming') return;
    SN.state = 'in'; SN.t0 = E.clock; SN.from = SN.k;
    focusOn(snail.position, 2.5);
  }
  function updateSnail(dt, t) {
    const e = t - SN.t0;
    if (SN.state === 'in') { SN.k = lerp(SN.from, 0.12, easeIO(clamp1(e / 1.8, 0, 1))); if (e > 1.8 + 5) { SN.state = 'coming'; SN.t0 = t; } }      // SPEC: out again after 5 s
    else if (SN.state === 'coming') { SN.k = lerp(0.12, 1, easeIO(clamp1(e / 2.6, 0, 1))); if (e > 2.6) SN.state = 'out'; }
    const crawl = SN.state === 'out' ? 1 : 0;
    SN.a += dt * 0.004 * crawl;                       // a very slow crawl around the top of the stone
    const cx = L.stone.x, cz = L.stone.z;
    snail.position.set(cx + Math.cos(SN.a) * 0.03, 0.025, cz + Math.sin(SN.a) * 0.018);
    snail.rotation.y = Math.atan2(-Math.cos(SN.a), -Math.sin(SN.a));
    snail.userData.stalks.forEach((g, i) => { g.scale.set(1, Math.max(0.05, SN.k), 1); g.rotation.z = -0.55 + Math.sin(t * 0.7 + i) * 0.08 * SN.k; });
  }

  /* ---------- the spider web between two dry stalks ---------- */
  function buildWeb() {
    webMat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide }); webMat.fog = false;
    const R = 0.066;
    const seg = Fn(([p, a, b]) => {
      const pa = p.sub(a), ba = b.sub(a);
      const h = clamp(dot(pa, ba).div(dot(ba, ba)), 0, 1);
      return length(pa.sub(ba.mul(h)));
    }).setLayout({ name: 'rainSegDist', type: 'float', inputs: [{ name: 'p', type: 'vec2' }, { name: 'a', type: 'vec2' }, { name: 'b', type: 'vec2' }] });
    webMat.positionNode = Fn(() => {
      const p = positionGeometry, r = length(p.xy);
      const w = smoothstep(0.09, 0.0, r);
      const tr = sin(uTime.mul(19).add(r.mul(80))).mul(U2.tremble).mul(0.006).add(sin(uTime.mul(1.3).add(p.x.mul(30))).mul(0.0008));
      return p.add(vec3(0, tr.mul(0.4), tr).mul(w));
    })();
    const webField = Fn(() => {
      const p = positionGeometry.xy, r = length(p), a = atan2(p.y, p.x);
      const lw = 0.0011;
      const NS = 17;
      const ds = abs(fract(a.div(6.2832).mul(NS).add(0.5)).sub(0.5)).mul(6.2832 / NS).mul(r);
      const spokes = exp(ds.div(lw).pow(2).negate()).mul(step(r, R)).mul(smoothstep(0.003, 0.008, r)).mul(0.8);
      const sp = 0.0074;
      const rs = r.add(a.div(6.2832).mul(sp));
      const dr = abs(fract(rs.div(sp)).sub(0.5)).mul(sp);
      const rings = exp(dr.div(lw * 0.8).pow(2).negate()).mul(smoothstep(R, R - 0.004, r)).mul(smoothstep(0.011, 0.016, r)).mul(0.6);
      const hub = exp(abs(r.sub(0.009)).div(lw).pow(2).negate());
      const anc = min(min(seg(p, vec2(-0.058, 0.03), vec2(-0.09, 0.075)), seg(p, vec2(0.06, 0.026), vec2(0.09, 0.06))),
        min(seg(p, vec2(-0.05, -0.042), vec2(-0.09, -0.085)), min(seg(p, vec2(0.052, -0.04), vec2(0.09, -0.09)), seg(p, vec2(-0.02, 0.063), vec2(-0.09, 0.115)))));
      const anchors = exp(anc.div(lw).pow(2).negate());
      // beads along the spiral
      const k = floor(rs.div(sp));
      const M = k.mul(1.6).add(10).floor();
      const cellA = a.div(6.2832).mul(M);
      const id = floor(cellA);
      const hb = hash12(vec2(k, id));
      const da = abs(fract(cellA).sub(0.5)).mul(6.2832).div(M).mul(r);
      const bd = length(vec2(da, dr));
      const br = hb.mul(0.0012).add(0.0011);
      const beads = smoothstep(br, br.mul(0.35), bd).mul(step(0.62, hb)).mul(smoothstep(R, R - 0.004, r)).mul(smoothstep(0.012, 0.018, r));
      return vec2(max(max(spokes, rings), max(hub, anchors)), beads);
    })();
    webMat.colorNode = Fn(() => {
      const thread = U.beadCol.mul(U.light.mul(0.65).add(0.12));
      const bead = U.beadCol.mul(U.light.mul(0.75).add(0.1)).mul(U2.shine.mul(1.3).add(1.0)).add(C('#C9A35B').mul(U.bead).mul(0.06));
      return mix(thread, bead, webField.y);
    })();
    webMat.opacityNode = max(webField.x.mul(0.32), webField.y.mul(0.85)).mul(U.light.mul(0.45).add(0.55));
    web = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.23, 16, 16), webMat); web.renderOrder = 2; scene.add(web);
  }
  const WB = { t0: -99 };
  function touchWeb() {
    WB.t0 = E.clock;
    sound.play('chime', web.position, 0.5);
    focusOn(web.position, 2.5);
    for (let i = 0; i < 6; i++) {
      const a = rand(0, 6.28), r = rand(0.015, 0.06);
      fall.add({ x: web.position.x + Math.cos(a) * r, y: web.position.y + Math.sin(a) * r, z: web.position.z, vx: 0, vy: -rand(0, 0.05), life: 3, });
    }
  }
  function updateWeb(dt, t) {
    const e = t - WB.t0;
    U2.tremble.value = e < 0 ? 0 : Math.exp(-e * 1.4) * smooth(0, 0.08, e);
    U2.shine.value = e < 0 ? 0 : smooth(0, 0.6, e) * (1 - smooth(1.5, 3.5, e));           // shine rises and fades over seconds, never flashes
  }

  /* ---------- catch a drop: it gathers on the tip, swells, falls in slow motion, a crown rises ---------- */
  function catchDrop(bi) {
    const c = catches.find((k) => k.state === 'idle') || catches[0];
    c.state = 'gather'; c.t0 = E.clock; c.blade = bi; c.m.visible = true;
    const fillIdx = tips.indexOf(bi); if (fillIdx >= 0) B.fill[bi] = 0;
    tipOf(bi, 0.985, tmpV);
    sound.play('note', tmpV, 1, { index: 7 + Math.floor(rand(0, 3)) });   // SPEC: one clear high piano note
    haptic(10);
    focusOn(tmpV, 2.5);
  }
  function crownAt(p) {
    const cr = crowns.find((k) => !k.on) || crowns[0];
    cr.on = true; cr.t0 = E.clock; cr.m.position.copy(p); cr.m.visible = true;
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * 6.28 + rand(-0.2, 0.2), v = rand(0.05, 0.09);
      spray.add({ x: p.x + Math.cos(a) * 0.006, y: 0.006, z: p.z + Math.sin(a) * 0.006, vx: Math.cos(a) * v, vy: rand(0.2, 0.3), vz: Math.sin(a) * v, life: rand(0.75, 1.0) });
    }
    if (inPuddle(p.x, p.z, 1)) ripple(p.x, p.z, 1.2);
    sound.play('drip', p, 0.35, { freq: 1320 });
  }
  function updateCatches(dt, t) {
    for (const c of catches) {
      if (c.state === 'idle') continue;
      const e = t - c.t0;
      if (c.state === 'gather') {
        tipOf(c.blade, 0.985, c.from);
        const g = easeOut(clamp1(e / 1.4, 0, 1)), sw = smooth(1.4, 2.0, e);
        const r = 0.0015 + g * 0.0036 + sw * 0.0009;
        c.m.scale.set(r, r * (1 + sw * 0.35), r);
        c.m.position.copy(c.from); c.m.position.y -= r * (0.6 + sw * 0.5);
        if (e > 2.0) { c.state = 'fall'; c.t0 = t; c.from.copy(c.m.position); c.land.set(c.from.x, 0.003, c.from.z); }
      } else if (c.state === 'fall') {
        const T = 1.6, f = clamp1(e / T, 0, 1);                             // slow motion
        c.m.position.lerpVectors(c.from, c.land, f * f);
        const r = 0.0055; c.m.scale.set(r * 0.92, r * (1.15 + 0.15 * f), r * 0.92);
        if (f >= 1) { c.state = 'idle'; c.m.visible = false; crownAt(c.land); }
      }
    }
    for (const cr of crowns) {
      if (!cr.on) continue;
      const e = t - cr.t0, f = clamp1(e / 1.1, 0, 1);
      const rad = 0.003 + easeOut(f) * 0.015, h = Math.sin(Math.min(1, f * 1.6) * Math.PI) * 0.011;
      cr.m.scale.set(rad, Math.max(0.0005, h), rad); cr.m.position.y = h / 2;
      cr.op.value = 0.75 * smooth(0, 0.06, e) * (1 - smooth(0.35, 1, f));
      if (f >= 1) { cr.on = false; cr.m.visible = false; }
    }
  }

  /* ---------- layout (depends on the view width) ---------- */
  function layout() {
    for (let i = 0; i < B.n; i++) {
      let x = placeX(B.u[i], B.d[i]), z = -B.d[i];
      if (B.kind[i] === 3) { x = L.web.x + B.stalk[i] * 0.092; z = L.web.z - 0.004; }
      if (B.kind[i] === 0 || B.kind[i] === 1) {                   // keep the near blades from hiding the leaf, the stone and the web (in screen terms)
        let u = B.u[i]; const d = B.d[i];
        for (const [o, size] of [[L.leaf, 0.07], [L.stone, 0.085], [L.web, 0.1]]) {
          const Ru = Math.min(0.05 + size / (VW * o.d), 0.3);
          if (Math.abs(u - o.u) < Ru && d < o.d + 0.08 && (d > o.d - 0.45 || B.h[i] > 0.12)) u = o.u + (u >= 0 ? 1 : -1) * Ru * 1.02;
        }
        x = placeX(u, d);
        if (inPuddle(x, z, 1.1)) x = L.puddle.x + Math.sign(x - L.puddle.x || 1) * L.puddle.rx * 1.15;
      }
      if (B.kind[i] === 2 && inPuddle(x, z, 1.15)) z -= 0.4;
      B.x[i] = x; B.y[i] = 0; B.z[i] = z;
      bladeAttr.base.setXYZ(i, x, 0, z);
    }
    bladeAttr.base.needsUpdate = true;
    // clover
    const c = S.clovers;
    c.forEach((p, i) => {
      const x = L.clover.x + p.dx * 0.1 * Math.min(1, VW / 0.6 + 0.25), z = L.clover.z + p.dz * 0.05;
      for (let k = 0; k < 3; k++) {
        tmpE.set(0, p.rot + k * 2.094, p.tilt, 'YZX');
        tmpQ.setFromEuler(tmpE); tmpS.setScalar(p.s);
        tmpM.compose(tmpV.set(x, p.h, z), tmpQ, tmpS); cloverMesh.setMatrixAt(i * 3 + k, tmpM);
      }
    });
    cloverMesh.instanceMatrix.needsUpdate = true;
  }
  function place() {
    for (const k of ['puddle', 'leaf', 'stone', 'clover', 'web']) { const o = L[k]; o.x = placeX(o.u, o.d); o.z = -o.d; }
    const pk = clamp1(VW / 0.74, 0.62, 1);
    L.puddle.rx = 0.3 * pk; L.puddle.rz = 0.15;
    puddle.position.set(L.puddle.x, 0.002, L.puddle.z); puddle.scale.set(L.puddle.rx, L.puddle.rz, 1);
    S.rim.position.set(L.puddle.x, 0.001, L.puddle.z); S.rim.scale.set(L.puddle.rx * 1.25, L.puddle.rz * 1.45, 1);
    stone.position.set(L.stone.x, 0.004, L.stone.z);
    S.leafAt = new THREE.Vector3(L.leaf.x, 0.004, L.leaf.z);
    const ax = Math.cos(L.leaf.yaw), az = -Math.sin(L.leaf.yaw), hl = S.leafLen / 2;
    leafPivot.position.set(L.leaf.x - ax * hl, 0.008, L.leaf.z - az * hl); leafPivot.rotation.y = L.leaf.yaw;
    // the beetle walks out from under the lifted end, toward the viewer
    LF.from.set(L.leaf.x + ax * hl * 0.5, 0.001, L.leaf.z + az * hl * 0.5); LF.to.set(L.leaf.x + ax * hl * 1.25, 0.001, L.leaf.z + az * hl * 1.25 + 0.05);
    web.position.set(L.web.x, L.web.y, L.web.z); web.rotation.y = 0.12;
    // the far tree line dips where the house stands, so its window can be seen
    L.house.x = L.house.u * VW * -L.house.z;
    const hx = L.house.x;
    const hillFn = (x) => 6.2 + 2.2 * Math.sin(x * 0.021 + 0.6) + 1.1 * Math.sin(x * 0.067 + 2.1) + 0.5 * Math.sin(x * 0.17) + 1.6 * Math.exp(-((x - hx) ** 2) / 300);
    const tf = (x) => 2.0 + 0.6 * Math.sin(x * 0.11 + 0.5) + 0.35 * Math.abs(Math.sin(x * 1.3)) + 0.2 * Math.abs(Math.sin(x * 3.7 + 1.0)) - 1.5 * (1 - smooth(1.5, 7, Math.abs(x - hx * 30 / 120)));
    if (treeRidge) { scene.remove(treeRidge); treeRidge.geometry.dispose(); }
    if (hillRidge) { scene.remove(hillRidge); hillRidge.geometry.dispose(); }
    hillRidge = ridge(scene, hillFn, -120, -300, 300, 400, hillMat);
    treeRidge = ridge(scene, tf, -30, -80, 80, 900, treeMat);
    L.house.y = hillFn(hx) - 0.5;
    house.position.set(hx, L.house.y, -119.5);
    houseWin.position.set(hx + 0.6, L.house.y + 1.2, -119.3);
    houseGlow.position.copy(houseWin.position);
    U2.winDir.value.copy(houseWin.position).sub(new THREE.Vector3(0, camY, 0)).normalize();
  }

  /* ---------- grass under the finger ---------- */
  function pushBlades(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy; if (len2 < 4) return null;
    const R = Math.max(38, innerWidth * 0.045);
    let hits = 0; const at = tmpV2.set(0, 0, 0);
    for (const i of push) {
      tmpV.set(B.x[i], B.h[i] * 0.6, B.z[i]);
      const s = toScreen(tmpV); if (!s.front) continue;
      const t = clamp1(((s.x - x0) * dx + (s.y - y0) * dy) / len2, 0, 1);
      const dist = Math.hypot(x0 + dx * t - s.x, y0 + dy * t - s.y);
      if (dist < R) {
        const k = (1 - dist / R) * clamp1(dx / 50, -1.2, 1.2) * (B.kind[i] === 0 ? 1 : 1.3);
        B.vel[i] += k * 1.6; hits++; at.add(tmpV);
        if (Math.abs(k) > 0.18) {                                       // SPEC: drops fall from the tips
          if (B.fill[i] > 0.5) { tipOf(i, 0.98, tmpV); B.fill[i] = 0; fall.add({ x: tmpV.x, y: tmpV.y, z: tmpV.z, vx: k * 0.05, vy: 0, life: 3 }); }
          else if (Math.random() < 0.12) { tipOf(i, 0.98, tmpV); fall.add({ x: tmpV.x, y: tmpV.y, z: tmpV.z, vx: k * 0.05, vy: 0, life: 3 }); }
        }
      }
    }
    return hits ? { hits, at: at.multiplyScalar(1 / hits) } : null;
  }
  let bladesMoving = true;
  function updateBlades(dt) {
    const sdt = Math.min(dt, 1 / 30), arr = bladeAttr.bend.array;
    let moving = false;
    for (const i of push) {
      if (B.vel[i] === 0 && B.bend[i] === 0) continue;
      B.vel[i] += (-6.5 * B.bend[i] - 3.2 * B.vel[i]) * sdt;          // SPEC: spring back over about 2 s
      B.bend[i] = clamp1(B.bend[i] + B.vel[i] * sdt, -0.6, 0.6);
      if (Math.abs(B.bend[i]) < 1e-4 && Math.abs(B.vel[i]) < 1e-4) { B.bend[i] = 0; B.vel[i] = 0; }
      arr[i] = B.bend[i]; moving = true;
    }
    if (moving || bladesMoving) bladeAttr.bend.needsUpdate = true;
    bladesMoving = moving;
  }
  function updateBeads(dt) {
    const regrow = dt / 7 * (0.25 + 0.75 * S._rainEff);
    tips.forEach((bi, k) => {
      B.fill[bi] = Math.min(1, B.fill[bi] + regrow);
      const r = 0.0042 * Math.sqrt(Math.max(0.0001, B.fill[bi])) * (0.7 + 0.3 * B.tint[bi]);
      tipOf(bi, 0.975, tmpV); tmpV.y -= r * 0.7;
      tmpS.set(r, r * 1.12, r); tmpM.compose(tmpV, tmpQ.identity(), tmpS); beadMesh.setMatrixAt(k, tmpM);
    });
    beadMesh.instanceMatrix.needsUpdate = true;
  }
  function pickTip(x, y) {
    let best = -1, bd = Math.max(30, innerWidth * 0.035);
    for (const i of near) {
      tipOf(i, 0.985, tmpV); const s = toScreen(tmpV); if (!s.front) continue;
      const d = Math.hypot(s.x - x, s.y - y); if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  /* ---------- rain amount: hold to soften; the hidden sunbreak ---------- */
  const RN = { level: 1, target: 1, holding: false, from: 1, t0: 0, dur: 1 };
  function rainTo(v) { if (v === RN.target) return; RN.from = RN.level; RN.target = v; RN.t0 = E.clock; RN.dur = v < RN.level ? 4 : 6; }
  const BRK = { state: 'idle', t0: 0, v: 0, need: 180, swelled: false };
  function startBreak() { if (BRK.state !== 'idle') return; BRK.state = 'clearing'; BRK.t0 = E.clock; BRK.swelled = false; }
  function updateRain(dt, t, info) {
    // SPEC: thins to a drizzle over 4 s; returns over 6 s after release
    RN.level = lerp(RN.from, RN.target, easeIO(clamp1((t - RN.t0) / RN.dur, 0, 1)));
    if (info.active && !info.resting && BRK.state === 'idle' && info.still > BRK.need) startBreak();
    if (BRK.state === 'idle' && info.still < 1) BRK.need = 180;
    const e = t - BRK.t0;
    if (BRK.state === 'clearing') { BRK.v = smooth(0, 12, e); if (e > 12) { BRK.state = 'clear'; BRK.t0 = t; } }
    else if (BRK.state === 'clear') { BRK.v = 1; if (e > 32) { BRK.state = 'returning'; BRK.t0 = t; } }
    else if (BRK.state === 'returning') { BRK.v = 1 - smooth(0, 16, e); if (e > 16) { BRK.state = 'idle'; BRK.v = 0; BRK.need = info.still + 300; } }
    const eff = RN.level * (1 - BRK.v);
    S._rainEff = eff;
    U2.rain.value = 0.04 + 0.96 * eff;
    U2.brk.value = BRK.v;
    const beamUp = BRK.state === 'clear' ? smooth(0, 6, e) : BRK.state === 'returning' ? 1 - smooth(0, 9, e) : 0;
    U2.beam.value = beamUp * (1 - env.night * 0.75);
    if (beamUp > 0.6 && !BRK.swelled) { BRK.swelled = true; sound.swell(['A3', 'C#4', 'E4']); }
    // steam rises from the grass while the sun is out
    if (beamUp > 0.15 && Math.random() < dt * 5 * beamUp) {
      const d = rand(0.5, 3.2), u = rand(-1, 1);
      steam.add({ x: placeX(u, d), y: rand(0.01, 0.06), z: -d, life: rand(8, 12), ph: rand(0, 6), k: 1 - env.night * 0.6, s: 1 });
    }
    // tiny splashes on the near ground, as many as the rain
    S._spl = (S._spl || 0) + dt * 26 * eff;
    while (S._spl > 1) {
      S._spl -= 1;
      const d = rand(0.32, 2.6), u = rand(-1.1, 1.1), x = placeX(u, d), z = -d;
      if (!inPuddle(x, z, 1)) splash.add({ x, y: 0.004, z, life: rand(0.5, 0.7), s: 1 });
    }
  }

  /* ---------- sound: hiss, near patter, a low soft layer; single drips when the rain thins ---------- */
  let soundNext = 0, dripNext = 0;
  function updateSound(t, info) {
    if (t > soundNext && S.layers) {
      soundNext = t + 0.3;
      const eff = S._rainEff;
      try {
        S.layers.hiss.gain.gain.rampTo(0.15 * (0.12 + 0.88 * eff), 0.6);
        S.layers.patter.forEach((l) => l.gain.gain.rampTo(rand(0.03, 0.085) * (0.1 + 0.9 * eff), rand(0.3, 0.9)));
      } catch (e) {}
    }
    if (info.active && !info.resting && S._rainEff < 0.62 && t > dripNext) {      // SPEC: single drips become clear
      const notes = [880, 988, 1109, 1319, 1480, 1760];
      const r = Math.random();
      if (r < 0.4) { const a = rand(0, 6.28), k = Math.sqrt(Math.random()) * 0.7; const x = L.puddle.x + Math.cos(a) * L.puddle.rx * k, z = L.puddle.z + Math.sin(a) * L.puddle.rz * k; ripple(x, z, 0.6); sound.play('drip', tmpV.set(x, 0, z), 0.5, { freq: notes[Math.floor(rand(0, notes.length))] }); }
      else { const d = rand(0.4, 1.4), u = rand(-1, 1); sound.play('drip', tmpV.set(placeX(u, d), 0.1, -d), 0.42, { freq: notes[Math.floor(rand(0, notes.length))] }); }
      dripNext = t + rand(0.7, 2.2) * (0.4 + S._rainEff);
    }
  }

  /* ---------- gallery window art: 300 x 200, slow CSS motion ---------- */
  let artCache = null;
  function windowArt() {
    if (artCache) return artCache;
    const r = seeded(23), f = (v) => v.toFixed(1);
    const blade = (x, base, tip, lean, w) => { const my = (base + tip) / 2; return `M${f(x)} ${base} Q${f(x + lean * 0.3)} ${f(my)} ${f(x + lean)} ${f(tip)} Q${f(x + w + lean * 0.3)} ${f(my)} ${f(x + w)} ${base}Z`; };
    let far = '', mid = '', nearB = '', drops = '', rain = '';
    for (let i = 0; i < 40; i++) { const x = r() * 310 - 5; far += `<path d="${blade(x, 150, 92 + r() * 30, (r() - 0.5) * 12, 2.5 + r() * 2)}"/>`; }

    const SANDALB = C3(col('#CDB396')), FC = C3(FIRECOL), PC = C3(PAPER), TC = C3(TIDE), LC_CORE = C3(col('#E8A85A')), LC_EDGE = C3(col('#B9805F'));
    const mat = new THREE.MeshBasicNodeMaterial(); mat.fog = false;
    mat.colorNode = Fn(() => {
      const P = positionWorld, x = P.x, z = P.z, t = uTime;
      const Vv = cameraPosition.sub(P), dist = length(Vv), Vn = Vv.div(dist);
      const sh = shoreFn(x);
      const lap = sin(t.mul(0.42).add(x.mul(0.05))).mul(0.1).add(sin(t.mul(0.23).add(1.3)).mul(0.06));
      const front = sh.add(lap).toVar();
      const wet = float(0).toVar(), foam = float(0).toVar(), glowF = float(0).toVar(), act = float(0).toVar();
      for (let k = 0; k < NW; k++) {
        const w = waveArr.element(k);
        const a = t.sub(w.x);
        const live = step(0, a).mul(step(a, 70));
        const dx = x.sub(w.y);
        const gx = exp(dx.mul(dx).div(-60));
        const g = gx.mul(w.z).mul(live);
        front.addAssign(g.mul(smoothstep(0, 2.6, a)).mul(smoothstep(2.9, 9, a).oneMinus()));     // runs up, then pulls back
        act.addAssign(gx.mul(live).mul(smoothstep(0, 1, a)).mul(smoothstep(2.4, 6, a).oneMinus()));
        const reach = sh.add(g.mul(0.97)).add(0.04);
        const dl = z.sub(reach);
        const left = smoothstep(2.4, 3.6, a).mul(exp(a.sub(3.6).max(0).div(-18)));                  // the foam line it leaves
        foam.addAssign(exp(dl.mul(dl).div(-0.006)).mul(left).mul(step(0.06, g)).mul(1.2));
        wet.assign(max(wet, smoothstep(reach.add(0.1), reach.sub(0.15), z).mul(exp(a.div(-30))).mul(step(0.06, g)).mul(smoothstep(0.5, 2.0, a))));
        glowF.addAssign(w.w.mul(gx).mul(live).mul(smoothstep(0, 1.2, a)).mul(smoothstep(4, 12, a).oneMinus()));
      }
      const dw = front.sub(z);                               // how far into the water
      const water = smoothstep(-0.025, 0.025, dw);
      // sand
      const n1 = fbm(P.xz.mul(vec2(2.2, 3.1)));
      const rip = sin(z.mul(17).add(x.mul(2.0)).add(n1.mul(6))).mul(0.5).add(0.5);
      const sandAmb = U.sand.mul(n1.mul(0.34).add(0.82)).mul(rip.mul(0.08).add(0.96));
      const damp = max(smoothstep(sh.add(1.0), sh.add(0.05), z).mul(0.75), wet);
      const fd = length(P.xz.sub(fireU.xz));
      const fq = fd.div(fireR.x);
      const core = exp(fq.mul(fq).negate());
      const pool = core.mul(0.9).add(float(0.05).div(fd.mul(fd).mul(0.8).add(1))).mul(fireU.w);
      const lightC = mix(LC_EDGE, LC_CORE, core).mul(pool);   // amber at the heart of the pool, clay at its edge
      const sandC = sandAmb.mul(mix(float(1), float(0.58), damp)).add(SANDALB.mul(lightC).mul(mix(float(1), float(0.7), damp))).toVar();
      // wet sand: glossy, catches the firelight and the sky
      const Lf = normalize(fireU.xyz.add(vec3(0, 0.25, 0)).sub(P));
      const Hf = normalize(Lf.add(Vn));
      const spec = pow(max(Hf.y, 0), 70).mul(fireU.w).mul(float(1.6).div(fd.mul(0.25).add(1)));
      sandC.addAssign(FC.mul(spec).mul(damp).mul(1.4));
      const fq2 = fd.div(fireR.x.mul(2.8));
      sandC.addAssign(LC_CORE.mul(exp(fq2.mul(fq2).negate())).mul(fireU.w).mul(wet.mul(0.5).add(damp.mul(0.12))));   // wet sand shines with firelight
      const Hs = normalize(U.sunDir.add(Vn)), Hm = normalize(U.moonDir.add(Vn));
      sandC.addAssign(U.glow.mul(pow(max(Hs.y, 0), 90)).mul(U.sunVis).mul(damp).mul(0.5));
      sandC.addAssign(vec3(0.6, 0.68, 0.7).mul(pow(max(Hm.y, 0), 120)).mul(U.moon).mul(damp).mul(0.35));
      sandC.addAssign(U.hor.mul(damp).mul(0.1));
      // sea
      const lod = clamp(dist.div(70).oneMinus(), 0, 1);
      const p2 = P.xz;
      const hA = vnoise(p2.mul(vec2(0.35, 1.1)).add(vec2(t.mul(0.03), t.mul(0.07))));
      const hB = vnoise(p2.add(vec2(0.07, 0)).mul(vec2(0.35, 1.1)).add(vec2(t.mul(0.03), t.mul(0.07))));
      const hC = vnoise(p2.add(vec2(0, 0.07)).mul(vec2(0.35, 1.1)).add(vec2(t.mul(0.03), t.mul(0.07))));
      const N = normalize(vec3(hA.sub(hB).mul(0.9).mul(lod), 1, hA.sub(hC).mul(0.9).mul(lod)));
      const fres = pow(max(dot(N, Vn), 0).oneMinus(), 4).mul(0.8).add(0.12);
      const R = reflect(Vn.negate(), N);
      const skyR = mix(U.hor, U.top, smoothstep(0.0, 0.35, R.y));
      const seaC = mix(U.sea, skyR, fres).toVar();
      const sp = max(dot(R, U.sunDir), 0);
      seaC.addAssign(U.sun.mul(pow(sp, 600).mul(2.4).add(pow(sp, 60).mul(0.2))).mul(U.sunVis).mul(smoothstep(-0.06, 0.02, U.sunDir.y)));
      const mp = max(dot(R, U.moonDir), 0);
      seaC.addAssign(vec3(0.72, 0.8, 0.8).mul(pow(mp, 500).mul(2.0).add(pow(mp, 50).mul(0.1))).mul(U.moon));
      seaC.addAssign(FC.mul(pool).mul(0.25));
      // shallow water over the sand near the front
      const shallow = smoothstep(0.0, 1.1, dw);
      const waterC = mix(sandC.mul(0.7).add(U.hor.mul(0.12)), seaC, shallow.mul(0.85).add(0.15));
      const colr = mix(sandC, waterC, water).toVar();
      // foam at the moving edge and the lines left behind
      const fn = vnoise(vec2(x.mul(5), z.mul(3).add(t.mul(0.25))));
      const edge = exp(dw.mul(dw).div(-0.01)).mul(act.mul(1.6).add(0.14)).mul(fn.mul(fn).mul(1.2).add(0.25));
      const bubbles = smoothstep(0.62, 0.8, vnoise(vec2(x.mul(14), z.mul(9)))).mul(exp(dw.div(-0.35))).mul(water).mul(act).mul(0.5)
        .add(smoothstep(0.5, 0.74, vnoise(vec2(x.mul(7), z.mul(4).sub(t.mul(0.2))))).mul(exp(dw.div(-0.7))).mul(water).mul(act).mul(0.45));   // lace on the running sheet
      const foamAll = edge.add(bubbles).add(foam.mul(fn.mul(0.6).add(0.5)));
      const foamC = PC.mul(U.day.mul(0.85).add(0.07)).add(SANDALB.mul(lightC).mul(0.9));
      colr.addAssign(foamC.mul(foamAll).mul(0.85));
      // SPEC hidden detail: some waves at night carry a faint blue glow in the foam, in the tide colour
      colr.addAssign(TC.mul(2.6).mul(glowF).mul(foamAll.add(edge.mul(0.5))).mul(U.night));
      // distance haze
      colr.assign(mix(colr, U.fog, smoothstep(25, 260, dist).mul(0.35)));
      colr.assign(mix(colr, U.fog, U.mist.mul(smoothstep(6, 60, dist)).mul(0.5)));
      return colr;
    })();
    const g = new THREE.PlaneGeometry(900, 420, 1, 1); g.rotateX(-Math.PI / 2); g.translate(0, 0, 8 - 210);
    const m = new THREE.Mesh(g, mat); m.frustumCulled = false; scene.add(m);
  }

  /* ---------- dunes on the left, with tall marram grass that sways in the wind (on the GPU) ---------- */
  const duneEdge = (z) => -(0.5 * VW * (6.3 - z) + 0.25) + 0.22 * Math.sin(z * 1.3 + 0.4) + 0.08 * Math.sin(z * 3.1);
  const duneH = (v, z) => {
    const crest = (0.95 + 0.3 * Math.sin(z * 0.8 + 1) + 0.15 * Math.sin(z * 2.1 + 0.3)) * smooth(-4.5, -0.6, z);
    return crest * (smooth(0, 0.2, v) - 0.3 * smooth(0.45, 1, v)) - 0.04 + 0.025 * Math.sin(v * 40 + z * 3) * smooth(0, 0.12, v);
  };
  const duneX = (v, z) => duneEdge(z) + 0.35 - v * 10;
  const GRASS_N = 1500;
  function buildDune() {
    const SANDALB = C3(col('#B8946E'));
    const mat = new THREE.MeshBasicNodeMaterial(); mat.fog = false;
    mat.colorNode = Fn(() => {
      const P = positionWorld, N = normalize(normalWorld);
      const n = fbm(P.xz.mul(vec2(1.8, 2.6)));
      const up = smoothstep(0.0, 0.32, P.y);                // the foot blends into the beach
      const amb = mix(U.sand, U.dune, up).mul(n.mul(0.3).add(0.82)).mul(mix(float(1), N.y.mul(0.3).add(0.72), up));
      const sunSide = U.glow.mul(max(dot(N, U.sunDir), 0)).mul(U.sunVis).mul(U.day).mul(0.22).mul(up);
      return amb.add(sunSide).add(SANDALB.mul(fireLit(P, N)).mul(0.8));
    })();
    duneMesh = new THREE.Mesh(new THREE.BufferGeometry(), mat); duneMesh.frustumCulled = false; scene.add(duneMesh);

    grassGeo = new THREE.InstancedBufferGeometry();
    { const seg = 5, pos = [], idx = [];
      for (let i = 0; i <= seg; i++) { const t = i / seg; pos.push(-0.5, t, 0, 0.5, t, 0); }
      for (let i = 0; i < seg; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
      grassGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); grassGeo.setIndex(idx); }
    grassAttr = { base: new THREE.InstancedBufferAttribute(new Float32Array(GRASS_N * 3), 3), shape: new THREE.InstancedBufferAttribute(new Float32Array(GRASS_N * 3), 3), lean: new THREE.InstancedBufferAttribute(new Float32Array(GRASS_N * 2), 2) };
    grassGeo.setAttribute('aBase', grassAttr.base); grassGeo.setAttribute('aShape', grassAttr.shape); grassGeo.setAttribute('aLean', grassAttr.lean);
    grassGeo.instanceCount = GRASS_N;
    const gm = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide }); gm.fog = false;
    gm.positionNode = Fn(() => {
      const base = attribute('aBase', 'vec3'), shape = attribute('aShape', 'vec3');
      const t = positionGeometry.y, h = shape.x, ph = shape.z;
      const sway = sin(uTime.mul(0.8).add(ph).add(base.x.mul(0.5))).mul(0.07).add(sin(uTime.mul(1.9).add(ph.mul(2))).mul(0.018)).add(windU.mul(0.35));
      const lean = attribute('aLean', 'vec2').mul(t).mul(t).mul(h).mul(3);
      const b = sway.mul(t).mul(t).mul(h);
      return base.add(vec3(positionGeometry.x.mul(shape.y).mul(t.mul(0.85).oneMinus()).add(b).add(lean.x), t.mul(h).mul(abs(sway).mul(0.15).add(length(lean).mul(0.5)).oneMinus()), b.mul(0.3).add(lean.y)));
    })();
    gm.colorNode = Fn(() => {
      const t = positionGeometry.y;
      const c = U.grass.mul(t.mul(0.35).add(0.75));
      const rim = U.glow.mul(t.mul(t)).mul(U.day).mul(U.sunVis).mul(0.18);
      return c.add(rim).add(C3(col('#9C8A5E')).mul(fireLit(positionWorld, vec3(0, 0.6, 0.8))).mul(0.55));
    })();
    const grass = new THREE.Mesh(grassGeo, gm); grass.frustumCulled = false; scene.add(grass);
  }
  function layoutDune() {
    const NU = 46, NV = 30, pos = [], idx = [];
    for (let i = 0; i <= NU; i++) {
      const z = lerp(6.8, -6, i / NU);
      for (let j = 0; j <= NV; j++) { const v = j / NV; pos.push(duneX(v, z), duneH(v, z), z); }
    }
    for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) {
      const a = i * (NV + 1) + j, b = a + NV + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    duneMesh.geometry.dispose(); duneMesh.geometry = g;
    const r = seeded(5);
    let i = 0;
    while (i < GRASS_N) {                                     // marram grows in tufts
      const z0 = lerp(-2.4, 6.4, r()), v0 = -0.01 + Math.pow(r(), 1.2) * 0.5, crest = smooth(0.03, 0.2, v0);
      const n = 6 + Math.floor(r() * 9), tall = (0.22 + r() * 0.3) * (0.55 + 0.6 * crest) * (z0 > -0.5 ? 1 : 0.85);
      for (let k = 0; k < n && i < GRASS_N; k++, i++) {
        const z = z0 + (r() - 0.5) * 0.12, v = v0 + (r() - 0.5) * 0.012, a = r() * 6.28, lean = 0.05 + r() * 0.12;
        grassAttr.base.setXYZ(i, duneX(v, z) + (r() - 0.5) * 0.08, duneH(v, z) - 0.01, z);
        grassAttr.shape.setXYZ(i, tall * (0.55 + r() * 0.6), 0.008 + r() * 0.007, r() * 6.28);
        grassAttr.lean.setXY(i, Math.cos(a) * lean, Math.sin(a) * lean);
      }
    }
    grassAttr.lean.needsUpdate = true;
    grassAttr.base.needsUpdate = true; grassAttr.shape.needsUpdate = true;
  }

  /* ---------- the fire: coals, a soft TSL flame, glow, heat shimmer ---------- */
  function buildFire() {
    const FC = C3(FIRECOL), EC = C3(EMBER), GC = C3(GOLD);
    // coals
    const coalMat = new THREE.MeshBasicNodeMaterial(); coalMat.fog = false;
    coalMat.colorNode = Fn(() => {
      const P = positionWorld, t = uTime;
      const q = P.xz.sub(fireU.xz);
      const r = length(q);
      const n = fbm(q.mul(9).add(vec2(t.mul(0.05), t.mul(-0.04))));
      const n2 = vnoise(q.mul(26).add(vec2(t.mul(-0.12), t.mul(0.09))));
      const hot = smoothstep(0.42, 0.72, n).mul(n2.mul(0.5).add(0.6)).mul(smoothstep(0.31, 0.08, r));
      const ash = U.sand.mul(0.35).add(vec3(0.02, 0.016, 0.012));
      return ash.add(EC.mul(hot).mul(coalU).mul(1.6)).add(GC.mul(pow(hot, 3)).mul(coalU).mul(2.2));
    })();
    const coals = new THREE.Mesh(new THREE.CircleGeometry(0.33, 28), coalMat);
    coals.rotation.x = -Math.PI / 2; coals.position.set(FIRE.x, 0.012, FIRE.z); scene.add(coals);

    // stones: one instanced ring, lit from the inside
    const stoneMat = new THREE.MeshBasicNodeMaterial(); stoneMat.fog = false;
    stoneMat.colorNode = Fn(() => {
      const P = positionWorld, N = normalize(normalWorld);
      const tone = hash12(vec2(float(instanceIndex), 3.1)).mul(0.3).add(0.85);
      return U.stone.mul(tone).mul(N.y.mul(0.35).add(0.7)).add(C3(col('#9A8878')).mul(fireLit(P, N)).mul(0.9));
    })();
    const ringN_ = 11, stones = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), stoneMat, ringN_);
    { const r = seeded(19);
      for (let i = 0; i < ringN_; i++) {
        const a = i / ringN_ * Math.PI * 2 + r() * 0.2, rr = 0.4 + r() * 0.04;
        tmpV.set(FIRE.x + Math.cos(a) * rr, 0.03, FIRE.z + Math.sin(a) * rr * 0.92);
        tmpE.set(r() * 0.6, r() * 6, r() * 0.5); tmpQ.setFromEuler(tmpE);
        tmpS.set(0.085 + r() * 0.04, 0.055 + r() * 0.03, 0.075 + r() * 0.03);
        tmpM.compose(tmpV, tmpQ, tmpS); stones.setMatrixAt(i, tmpM);
      } }
    scene.add(stones);

    // flame: one billboard, fbm tongues, additive
    const fmat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }); fmat.fog = false;
    const CORE = C3(col('#F6E2B4')), MID = C3(col('#E0A456')), EDGE = C3(col('#B9805F'));
    fmat.colorNode = Fn(() => {
      const u = uv(), t = uTime;
      const x = u.x.sub(0.5).mul(2), y = u.y;
      const n = fbm(vec2(x.mul(1.7).add(3.3), y.mul(2.1).sub(t.mul(1.25))));
      const n2 = vnoise(vec2(x.mul(4.2), y.mul(3.6).sub(t.mul(2.2))).add(5.1));
      const sway = n.sub(0.5).mul(y).mul(0.75).add(sin(t.mul(0.9)).mul(0.05).mul(y));
      const xx = abs(x.add(sway));
      const w = mix(float(0.8), float(0.05), pow(y, 0.8)).mul(n2.mul(0.35).add(0.82));
      const body = smoothstep(w, w.mul(0.12), xx);
      const top = smoothstep(1.0, 0.2, y.add(n.sub(0.5).mul(0.6)));
      const base = smoothstep(0.0, 0.1, y);
      const i = body.mul(top).mul(base).toVar();
      i.mulAssign(mix(float(1), smoothstep(0.3, 0.62, n2.mul(0.7).add(n.mul(0.6))), smoothstep(0.3, 0.85, y)));
      const c = mix(EDGE, MID, smoothstep(0.06, 0.38, i)).toVar();
      c.assign(mix(c, CORE, smoothstep(0.42, 0.85, i)));
      return c.mul(i).mul(flameU.x);
    })();
    const fg = new THREE.PlaneGeometry(0.62, 1.0); fg.translate(0, 0.5, 0);
    flame = new THREE.Mesh(fg, fmat); flame.position.set(FIRE.x, 0.03, FIRE.z + 0.02); flame.renderOrder = 3; scene.add(flame);

    glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xE0A456, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    glowSprite.position.set(FIRE.x, 0.35, FIRE.z); glowSprite.renderOrder = 2; scene.add(glowSprite);

    // SPEC hidden detail: heat shimmer above the fire bends the stars behind it (a small refraction strip)
    const smat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false }); smat.fog = false;
    const su = uv();
    const smask = smoothstep(0.0, 0.3, su.y).mul(smoothstep(1.0, 0.45, su.y)).mul(smoothstep(0.5, 0.12, abs(su.x.sub(0.5))));
    const sn1 = vnoise(vec2(su.x.mul(7), su.y.mul(6).sub(uTime.mul(2.0)))).sub(0.5);

    const sg = new THREE.PlaneGeometry(0.9, 1.7); sg.translate(0, 0.85, 0);
    shimmer = new THREE.Mesh(sg, smat); shimmer.position.set(FIRE.x, 0.75, FIRE.z); shimmer.renderOrder = 5; scene.add(shimmer);
  }

  /* ---------- wood: logs in the fire, the driftwood pile, the log being carried, logs that burn ---------- */
  const logGeo = new THREE.CylinderGeometry(1, 1, 1, 9, 1); logGeo.rotateZ(Math.PI / 2);     // axis along x
  function woodMat(charNode, instanced) {
    const m = new THREE.MeshBasicNodeMaterial(); m.fog = false;
    const WA = C3(col('#B8A48C')), CH = C3(col('#16110D')), EC = C3(EMBER), GC = C3(GOLD);
    m.colorNode = Fn(() => {
      const P = positionWorld, N = normalize(normalWorld), g = positionGeometry;
      const grain = vnoise(vec2(g.x.mul(3.5), g.y.mul(9).add(g.z.mul(9)))).mul(0.5).add(vnoise(vec2(g.x.mul(1.2), g.z.mul(3))).mul(0.5));
      const tone = instanced ? hash12(vec2(float(instanceIndex), 7.7)).mul(0.35).add(0.8) : float(1);
      const ch = charNode;
      const base = mix(U.wood.mul(tone), CH, ch).mul(grain.mul(0.45).add(0.75)).mul(N.y.mul(0.3).add(0.75));
      const lit = WA.mul(fireLit(P, N)).mul(mix(float(1), float(0.25), ch));
      const em = smoothstep(0.62, 0.86, vnoise(P.xz.mul(16).add(vec2(uTime.mul(0.15), 0)))).mul(ch).mul(coalU).mul(smoothstep(0.6, -0.2, N.y));
      return base.add(lit).add(EC.mul(em).mul(1.3)).add(GC.mul(em.mul(em)).mul(0.8));
    })();
    return m;
  }
  function buildWood() {
    // three charred logs crossing in the ring
    const inFire = new THREE.InstancedMesh(logGeo, woodMat(float(1), false), 3);
    [[0.25, 0.1, 0.055], [1.35, -0.12, 0.05], [2.4, 0.08, 0.045]].forEach(([ry, rz, r], i) => {
      tmpV.set(FIRE.x, r + 0.02 + i * 0.03, FIRE.z); tmpE.set(0, ry, rz); tmpQ.setFromEuler(tmpE); tmpS.set(0.62, r, r);
      tmpM.compose(tmpV, tmpQ, tmpS); inFire.setMatrixAt(i, tmpM);
    });
    scene.add(inFire);
    // driftwood pile (laid out in resize)
    pileMesh = new THREE.InstancedMesh(logGeo, woodMat(float(0), true), 7); pileMesh.frustumCulled = false; scene.add(pileMesh);
    // the log the visitor carries
    dragLog = new THREE.Mesh(logGeo, woodMat(float(0), false)); dragLog.scale.set(0.66, 0.034, 0.034); dragLog.visible = false; scene.add(dragLog);
    // logs that burn after being added (at most 3)
    for (let i = 0; i < 3; i++) {
      const ch = uniform(0);
      const m = new THREE.Mesh(logGeo, woodMat(ch, false)); m.visible = false; scene.add(m);
      burning.push({ m, ch, t0: -999, active: false, ry: 0 });
    }
  }
  // [dx, layer, dz, rotation y, length, radius]: a loose heap, not a stack
  const PILE_LOGS = [[0, 0, 0, 1.25, 0.78, 0.036], [0.12, 0, 0.1, 1.9, 0.62, 0.03], [-0.13, 0, -0.06, 0.95, 0.7, 0.032], [0.24, 0, -0.12, 2.3, 0.5, 0.026],
    [0.05, 1, 0.03, 1.6, 0.66, 0.03], [-0.05, 1, -0.02, 0.7, 0.55, 0.026], [0.32, 0, 0.22, 0.4, 0.42, 0.022]];
  function layoutPile() {
    PILE.set(clamp1(0.5 * VW * (6 - 3.7), 0.42, 1.25), 0, 3.7);
    PILE_LOGS.forEach(([dx, layer, dz, ry, len, r], i) => {
      tmpV.set(PILE.x + dx, r + layer * 0.05, PILE.z + dz); tmpE.set(0.05 * (i % 2 ? 1 : -1), ry, layer ? 0.12 * (i % 2 ? 1 : -1) : 0.02); tmpQ.setFromEuler(tmpE); tmpS.set(len, r, r);
      tmpM.compose(tmpV, tmpQ, tmpS); pileMesh.setMatrixAt(i, tmpM);
    });
    pileMesh.instanceMatrix.needsUpdate = true;
  }

  /* ---------- particles: sparks and embers, smoke, constellation stars, the shooting star's trail ---------- */
  function buildParticles() {
    sparks = new Pool(scene, 160, { additive: true, size: 0.03, color: 0xF0C97A, gain: 2.6, step: (p, dt, t) => {
      const f = p.age / p.life, w = wind(t);
      if (p.spiral) {                                         // stirred: a helix that widens as it rises
        p.ang += p.w * dt; p.rad += 0.07 * dt; p.vy *= Math.exp(-dt * 0.45);
        p.cy += p.vy * dt; p.cx += w * 0.25 * dt * smooth(0.3, 1.5, p.age);
        p.x = p.cx + Math.cos(p.ang) * p.rad; p.z = p.cz + Math.sin(p.ang) * p.rad * 0.8; p.y = p.cy;
      } else {
        p.vy *= Math.exp(-dt * 0.6);
        p.x += (w * 0.6 + Math.sin(t * 2.1 + p.ph) * 0.08) * dt; p.y += p.vy * dt; p.z += Math.cos(t * 1.7 + p.ph) * 0.05 * dt;
      }
      p.s = 1 - 0.5 * f;
      return smooth(0, 0.22, p.age) * (1 - smooth(0.45, 1, f)) * p.b;   // SPEC: each spark rises and fades over at least 0.5 s
    } });
    smoke = new Pool(scene, 80, { size: 0.3, color: 0xCFC6B8, gain: 1, step: (p, dt, t) => {
      const f = p.age / p.life, w = wind(t);
      p.x += (w * smooth(0, 3, p.age) + Math.sin(p.age * 0.7 + p.ph) * 0.06) * dt;
      p.y += p.vy * dt; p.vy = Math.max(0.2, p.vy * Math.exp(-dt * 0.05));
      p.z += Math.cos(p.age * 0.5 + p.ph) * 0.04 * dt - 0.03 * dt;
      p.s = 0.6 + p.age * 0.38;
      return smooth(0, 0.07, f) * (1 - smooth(0.3, 1, f)) * p.a * S.smokeA * (0.55 + 0.45 * smooth(0, 2, p.age));
    } });
    trail = new Pool(scene, 160, { additive: true, size: 2.4, color: 0xEFE3CF, gain: 2.2, step: (p) => {
      const f = p.age / p.life; p.s = 1 - 0.6 * f;
      return (1 - f) * (1 - f) * p.b;
    } });
  }

  function buildStars() {
    // brighter stars the visitor can join; fixed seeded directions in the part of the sky the view can reach
    stars = new Pool(scene, STAR_N, { additive: true, size: 2.6, color: 0xF3E8D2, gain: 1.6, step: (p, dt, t) => {
      const lit = p.lit > -1 ? 1 - smooth(45, 60, E.clock - p.lit) : 0;
      const tw = 0.82 + 0.18 * Math.sin(t * p.rate + p.ph);
      p.s = p.s0 * (1 + 0.35 * lit);
      return env.star * p.b * tw * (1 + 0.6 * lit);
    } });
    const r = seeded(29);
    for (let i = 0; i < STAR_N; i++) {
      const az = (r() * 2 - 1) * 48 * DEG, el = (2.5 + Math.pow(r(), 1.15) * 33) * DEG;
      const d = dirAzEl(az, el, new THREE.Vector3());
      const p = { x: CAMP.x + d.x * 300, y: CAMP.y + d.y * 300, z: CAMP.z + d.z * 300, life: Infinity, b: 0.35 + Math.pow(r(), 2.2) * 0.75, s0: 0.6 + r() * 0.7, ph: r() * 6.28, rate: 0.25 + r() * 0.5, lit: -1, el: el / DEG, i };
      p.s = p.s0; starList.push(p); stars.add(p);
    }
    // trace lines: one LineSegments buffer, each segment fades after 60 s
    lineGeo = new THREE.BufferGeometry();
    linePos = new THREE.Float32BufferAttribute(new Float32Array(MAXSEG * 6), 3).setUsage(THREE.DynamicDrawUsage);
    lineBorn = new THREE.Float32BufferAttribute(new Float32Array(MAXSEG * 2).fill(-1e4), 1).setUsage(THREE.DynamicDrawUsage);
    lineGeo.setAttribute('position', linePos); lineGeo.setAttribute('aBorn', lineBorn);
    const lm = new THREE.LineBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }); lm.fog = false;
    const GC = C3(GOLD);
    lm.colorNode = GC.mul(1.5);
    lm.opacityNode = Fn(() => {
      const age = uTime.sub(attribute('aBorn', 'float'));
      return smoothstep(0, 1.4, age).mul(smoothstep(60, 46, age)).mul(0.85);
    })();
    const lines = new THREE.LineSegments(lineGeo, lm); lines.frustumCulled = false; scene.add(lines);
  }

  /* ---------- interactions ---------- */
  function addSegment(a, b) {
    const i = segIdx; segIdx = (segIdx + 1) % MAXSEG;
    const k = 0.985;                                          // slightly in front of the star sprites
    linePos.setXYZ(i * 2, CAMP.x + (a.x - CAMP.x) * k, CAMP.y + (a.y - CAMP.y) * k, CAMP.z + (a.z - CAMP.z) * k);
    linePos.setXYZ(i * 2 + 1, CAMP.x + (b.x - CAMP.x) * k, CAMP.y + (b.y - CAMP.y) * k, CAMP.z + (b.z - CAMP.z) * k);
    lineBorn.setX(i * 2, E.clock); lineBorn.setX(i * 2 + 1, E.clock);
    linePos.needsUpdate = true; lineBorn.needsUpdate = true;
  }
  function nearestStar(x, y, R, skip) {
    let best = -1, bd = R;
    for (const p of starList) {
      if (p.i === skip) continue;
      tmpV.set(p.x, p.y, p.z); const s = toScreen(tmpV); if (!s.front) continue;
      const d = Math.hypot(s.x - x, s.y - y); if (d < bd) { bd = d; best = p.i; }
    }
    return best;
  }
  function joinStar(g, idx) {
    if (idx < 0 || idx === g.last) return;
    const p = starList[idx];
    if (g.last >= 0) addSegment(starList[g.last], p);
    p.lit = E.clock; g.last = idx; g.count++;
    tmpV.set(p.x, p.y, p.z).sub(E.camera.position).normalize().multiplyScalar(12).add(E.camera.position);
    const n = clamp1(Math.round((p.el - 2.5) / 33 * 6) + 2, 0, NOTES_HI.length - 1);
    sound.play('chime', tmpV, 0.5, { note: NOTES_HI[n] });   // SPEC: one soft high note per star, in key; no haptic
  }
  function traceAt(g, x, y) {
    const R = Math.max(30, innerWidth * 0.035);
    // sample along the path so a fast drag still joins the stars it crosses
    const px = g.px ?? x, py = g.py ?? y, steps = Math.max(1, Math.ceil(Math.hypot(x - px, y - py) / 14));
    for (let k = 1; k <= steps; k++) joinStar(g, nearestStar(px + (x - px) * k / steps, py + (y - py) * k / steps, R, g.last));
    g.px = x; g.py = y;
  }

  function stir() {                                          // SPEC: tap the coals: a spiral of sparks for 2 to 3 s
    const n = 54;
    for (let i = 0; i < n; i++) {
      sparks.add({ spiral: true, cx: FIRE.x, cz: FIRE.z, cy: 0.1 + rand(0, 0.15), ang: i * 0.47, rad: 0.04 + rand(0, 0.05), w: 2.4 + rand(-0.3, 0.3),
        vy: rand(0.7, 1.15), life: rand(2.0, 3.0), b: rand(0.6, 1), x: FIRE.x, y: 0.1, z: FIRE.z, age: -i * 0.012 });
    }
    fire.coalBoost = 1;
    sound.play('rush', FIRE_SND, 0.75);
    for (let k = 0; k < 5; k++) fire.crackles.push(E.clock + 0.05 + k * rand(0.08, 0.16));
    haptic(10); focusOn(FIRE_SND, 2.5);
  }

  function wave(x, amp, touched) {                           // SPEC: one wave runs up the sand, leaves a foam line, pulls back
    let k = 0, oldest = Infinity;
    for (let i = 0; i < NW; i++) if (waves[i].x < oldest) { oldest = waves[i].x; k = i; }
    const glow = env.night > 0.5 && Math.random() < (touched ? 0.45 : 0.3) ? 1 : 0;
    waves[k].set(E.clock, x, amp, glow);
    tmpV.set(x, 0, shoreZ(x));
    sound.play('wash', tmpV, touched ? 0.8 : 0.4);
    if (touched) { haptic(15); focusOn(tmpV, 3); }
  }

  function startDrag(p) {
    drag.on = true; drag.state = 'carry';
    dragLog.visible = true; dragLog.position.set(PILE.x, 0.2, PILE.z); dragLog.rotation.set(0, 1.5, 0);
    drag.target.copy(dragLog.position);
    sound.play('scratch', PILE, 0.6); sound.play('rustle', PILE, 0.4);
    focusOn(PILE, 2);
  }
  function moveDrag(x, y) {
    const h = hitPlaneY(x, y, 0.15);
    if (!h) return;
    h.x = clamp1(h.x, -3, 3); h.z = clamp1(h.z, -1, 5.4);
    drag.target.set(h.x, 0.24, h.z);
    drag.over = Math.hypot(h.x - FIRE.x, h.z - FIRE.z) < 0.8 || nearScreen(tmpV.set(FIRE.x, 0.2, FIRE.z), x, y, Math.max(60, innerWidth * 0.07));
  }
  function dropDrag() {
    if (drag.state !== 'carry') return;
    drag.from.copy(dragLog.position); drag.t0 = E.clock;
    if (drag.over) { drag.state = 'falling'; }
    else { drag.state = 'returning'; sound.play('thump', dragLog.position, 0.25, { note: 'C2' }); }
    drag.on = false; drag.over = false;
  }
  function feedLog(fromPos) {                               // the log lands in the fire
    let b = burning.find((x) => !x.active) || burning.reduce((a, c) => (c.t0 < a.t0 ? c : a));
    b.active = true; b.t0 = E.clock; b.ry = rand(0, Math.PI); b.m.visible = true; b.ch.value = 0;
    b.m.position.set(FIRE.x + rand(-0.04, 0.04), 0.1, FIRE.z + rand(-0.04, 0.04)); b.m.rotation.set(0, b.ry, rand(-0.1, 0.1)); b.m.scale.set(0.7, 0.048, 0.048);
    fire.boost = Math.min(fire.boost + 0.55, 0.85); fire.lastLog = E.clock;
    for (let k = 0; k < 14; k++) fire.crackles.push(E.clock + 0.15 + Math.pow(k / 14, 1.3) * 6 + rand(0, 0.2));   // more crackle over 6 s
    setTimeout(() => sound.play('thump', FIRE_SND, 0.6, { note: 'F1' }), 1300);                                    // then a low settle
    haptic(15);
    for (let i = 0; i < 22; i++) sparks.add({ x: FIRE.x + rand(-0.12, 0.12), y: 0.2, z: FIRE.z + rand(-0.1, 0.1), vy: rand(0.6, 1.4), life: rand(1.2, 2.4), b: rand(0.5, 1), ph: rand(0, 6) });
    focusOn(FIRE_SND, 2.5);
  }
  function updateDrag(dt, t) {
    if (drag.state === 'carry') {
      dragLog.position.lerp(drag.target, 1 - Math.exp(-dt * 12));
      dragLog.position.y = 0.22 + Math.sin(t * 2.2) * 0.012;
      dragLog.rotation.y += (1.4 + (dragLog.position.x - drag.target.x) * 0.8 - dragLog.rotation.y) * (1 - Math.exp(-dt * 6));
      flameU.value.y += ((drag.over ? 1 : 0) - flameU.value.y) * (1 - Math.exp(-dt * 4));
    } else flameU.value.y *= Math.exp(-dt * 4);
    if (drag.state === 'falling') {
      const f = clamp1((t - drag.t0) / 0.7, 0, 1), e = easeIO(f);
      dragLog.position.lerpVectors(drag.from, tmpV.set(FIRE.x, 0.1, FIRE.z), e); dragLog.position.y += Math.sin(f * Math.PI) * 0.12;
      if (f >= 1) { dragLog.visible = false; drag.state = 'idle'; feedLog(); }
    } else if (drag.state === 'returning') {
      const f = clamp1((t - drag.t0) / 0.8, 0, 1), e = easeIO(f);
      dragLog.position.lerpVectors(drag.from, tmpV.set(PILE.x, 0.18, PILE.z), e);
      if (f >= 1) { dragLog.visible = false; drag.state = 'idle'; }
    }
  }

  function shootingStar() {                                 // SPEC: stay still 60 to 120 s: one slow shooting star
    const side = Math.random() < 0.5 ? -1 : 1;
    const az0 = side * rand(6, 22) * DEG, el0 = rand(11, 17) * DEG;
    dirAzEl(az0, el0, shoot.a); dirAzEl(az0 - side * rand(16, 24) * DEG, el0 - rand(5, 8) * DEG, shoot.b);
    shoot.on = true; shoot.t0 = E.clock; shoot.dur = rand(2.6, 3.2); shoot.lastF = 0; shoot.tPrev = E.clock;
  }
  function updateShoot(t) {
    if (!shoot.on) return;
    const f = clamp1((t - shoot.t0) / shoot.dur, 0, 1);
    const env_ = smooth(0, 0.22, f) * (1 - smooth(0.72, 1, f)) * clamp1(env.star * 1.2, 0, 1);
    const n = clamp1(Math.ceil((f - shoot.lastF) / 0.004), 1, 12);   // fill the path between frames so the trail stays smooth
    for (let k = 1; k <= n; k++) {
      const ff = lerp(shoot.lastF, f, k / n), e = easeIO(ff) * 0.6 + ff * 0.4;
      tmpV.lerpVectors(shoot.a, shoot.b, e).normalize();
      trail.add({ x: CAMP.x + tmpV.x * 290, y: CAMP.y + tmpV.y * 290, z: CAMP.z + tmpV.z * 290, life: 0.9, b: env_, age: (1 - k / n) * Math.min(0.5, t - shoot.tPrev) });
    }
    shoot.lastF = f; shoot.tPrev = t;
    if (f >= 1) shoot.on = false;
  }

  /* ---------- the fire's life: growth, embers, sparks, smoke, crackle ---------- */
  function updateFire(dt, t, info) {
    const since = t - fire.lastLog;
    fire.boost *= Math.exp(-dt / 170);
    const base = lerp(1.0, 0.16, smooth(240, 600, since));   // SPEC: no log for 10 minutes: the fire sinks to glowing embers
    fire.target = Math.min(1.75, base + fire.boost * smooth(0, 0.6, base + 0.3));
    fire.level += (fire.target - fire.level) * (1 - Math.exp(-dt / 2));     // grows over about 6 s
    fire.coalBoost *= Math.exp(-dt / 1.2);
    const L = fire.level, day = env.day;
    // a slow, small flicker: well under 3 changes a second, so nothing flashes
    const flick = 1 + 0.045 * Math.sin(t * 5.3) * Math.sin(t * 1.7 + 0.4) + 0.03 * Math.sin(t * 7.9 + 1.3);
    const lightK = (1 - 0.82 * day) * flick;
    fireU.value.w = lerp(0.25, 1.0, smooth(0.1, 1, L)) * (0.75 + 0.35 * L) * lightK;
    fireR.value.x = 0.5 + 0.75 * L;
    fireR.value.y = 1 / (0.35 + 0.9 * L);
    flameU.value.x = lerp(1.9, 0.6, day) * (1 + 0.5 * flameU.value.y) * smooth(0.12, 0.5, L);
    coalU.value = (0.75 + 0.35 * Math.min(L, 1) + 0.9 * fire.coalBoost) * lerp(1, 0.45, day);
    shimU.value = smooth(0.2, 1, L) * (0.7 + 0.3 * L);
    flame.scale.set(0.65 + 0.4 * L, 0.35 + 0.72 * L, 1);
    flame.quaternion.copy(E.camera.quaternion);
    shimmer.quaternion.copy(E.camera.quaternion); shimmer.position.y = 0.2 + 0.7 * L; shimmer.scale.setScalar(0.7 + 0.35 * L);
    glowSprite.scale.setScalar((1.0 + 0.8 * L) * (1 + 0.04 * Math.sin(t * 1.3)));
    glowSprite.material.opacity = lerp(0.42, 0.08, day) * smooth(0.05, 0.7, L);
    windU.value = wind(t) - 0.2;

    // ambient sparks and embers
    fire.sparkAcc += dt * (0.6 + 2.6 * L * L);
    while (fire.sparkAcc > 1) { fire.sparkAcc -= 1;
      sparks.add({ x: FIRE.x + rand(-0.12, 0.12), y: 0.15 + 0.3 * L * Math.random(), z: FIRE.z + rand(-0.1, 0.1), vy: rand(0.35, 0.8) * (0.6 + 0.5 * L), life: rand(1.4, 3.0), b: rand(0.35, 0.9) * lerp(1, 0.5, day), ph: rand(0, 6) }); }
    // smoke
    fire.smokeAcc += dt * (3 + 2 * L);
    while (fire.smokeAcc > 1) { fire.smokeAcc -= 1;
      smoke.add({ x: FIRE.x + rand(-0.06, 0.06), y: 0.35 + 0.55 * L, z: FIRE.z + rand(-0.05, 0.05), vy: rand(0.26, 0.4), life: rand(7, 11), a: rand(0.6, 1), ph: rand(0, 6) }); }

    // burning logs char, then sink into the coals over a few minutes
    for (const b of burning) {
      if (!b.active) continue;
      const age = t - b.t0;
      b.ch.value = smooth(0, 8, age);
      const sink = smooth(60, 240, age);
      b.m.scale.set(0.7 * (1 - 0.4 * sink), 0.048 * (1 - 0.85 * sink), 0.048 * (1 - 0.85 * sink));
      b.m.position.y = 0.1 - 0.06 * sink;
      if (age > 240) { b.active = false; b.m.visible = false; }
    }

    // crackle: queued bursts plus random one-shots, more when the fire is big
    if (info.active && !info.resting) {
      while (fire.crackles.length && fire.crackles[0] <= t) { fire.crackles.shift(); sound.play('crackle', FIRE_SND, rand(0.45, 0.9), { dur: rand(0.02, 0.05) }); }
      if (t > fire.nextCrackle) { sound.play('crackle', FIRE_SND, rand(0.25, 0.6) * (0.5 + 0.5 * L), { dur: rand(0.015, 0.04) }); fire.nextCrackle = t + rand(0.7, 2.6) / (0.4 + 0.6 * L); }
    } else fire.crackles.length = 0;
    if (S.hiss && t > fire.nextHiss) {                       // a fizzing layer whose gain jumps in small steps
      const pop = Math.random() < 0.3;
      S.hiss.gain.gain.rampTo((pop ? rand(0.03, 0.07) : rand(0.004, 0.012)) * (0.5 + 0.5 * L), 0.025);
      fire.nextHiss = t + rand(0.05, 0.16);
    }
    if (S.fireLow) S.fireLow.gain.gain.rampTo(0.05 + 0.05 * L, 0.5);
  }

  /* ---------- gallery window art: 300 x 200, slow CSS motion, adapted from the bonfire study ---------- */
  const windowArt = () => {
    const r = seeded(41); let st = '';
    for (let i = 0; i < 70; i++) { const big = r() > 0.9; st += `<circle class="fr-st" cx="${(r() * 300).toFixed(1)}" cy="${(Math.pow(r(), 1.2) * 110).toFixed(1)}" r="${(big ? 0.8 + r() * 0.5 : 0.3 + r() * 0.35).toFixed(2)}"/>`; }
    for (let i = 0; i < 40; i++) { const t = r(); st += `<circle cx="${(10 + t * 280).toFixed(1)}" cy="${(90 - t * 80 + (r() - 0.5) * 22).toFixed(1)}" r="${(0.25 + r() * 0.3).toFixed(2)}" opacity=".7"/>`; }
    let sp = '';
    for (let i = 0; i < 12; i++) sp += `<circle class="fr-sp" cx="${(146 + r() * 10).toFixed(1)}" cy="${(162 + r() * 10).toFixed(1)}" r="${(0.4 + r() * 0.6).toFixed(2)}"/>`;
    return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="fr-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090808"/><stop offset=".65" stop-color="#151A1C"/><stop offset="1" stop-color="#2B3739"/></linearGradient>
      <linearGradient id="fr-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2B2D"/><stop offset="1" stop-color="#0F1416"/></linearGradient>
      <linearGradient id="fr-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2119"/><stop offset="1" stop-color="#140F0C"/></linearGradient>
      <radialGradient id="fr-light"><stop offset="0" stop-color="#E8A85A" stop-opacity=".75"/><stop offset=".45" stop-color="#B9805F" stop-opacity=".25"/><stop offset="1" stop-color="#B9805F" stop-opacity="0"/></radialGradient>
      <filter id="fr-band" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="fr-smoke-b" x="-100%" y="-50%" width="300%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <style>
      .fr-st { animation: fr-tw 6s ease-in-out infinite; }
      .fr-st:nth-child(3n) { animation-duration: 8s; animation-delay: -2s; }
      .fr-st:nth-child(4n+1) { animation-duration: 5s; animation-delay: -4s; }
      @keyframes fr-tw { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      .fr-fl { transform-box: fill-box; transform-origin: 50% 100%; animation: fr-flick 1.8s ease-in-out infinite; }
      .fr-fl2 { transform-box: fill-box; transform-origin: 50% 100%; animation: fr-flick 2.3s ease-in-out infinite reverse; }
      @keyframes fr-flick { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(.96, 1.06); } 50% { transform: scale(1.03, .95); } 75% { transform: scale(.98, 1.04); } }
      .fr-sp { animation: fr-rise 4s ease-out infinite; }
      .fr-sp:nth-child(2n) { animation-duration: 5s; animation-delay: -1.3s; }
      .fr-sp:nth-child(3n) { animation-duration: 3.6s; animation-delay: -2.6s; }
      @keyframes fr-rise { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(10px, -90px); opacity: 0; } }
      .fr-sm { animation: fr-sm 14s ease-in-out infinite alternate; }
      @keyframes fr-sm { from { transform: translate(0, 0); opacity: .14; } to { transform: translate(22px, -14px); opacity: .05; } }
      .fr-gl { animation: fr-gl 3s ease-in-out infinite; }
      @keyframes fr-gl { 0%, 100% { opacity: .55; } 50% { opacity: .7; } }
      .fr-wv { animation: fr-wv 9s ease-in-out infinite; }
      @keyframes fr-wv { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { .fr-st, .fr-fl, .fr-fl2, .fr-sp, .fr-sm, .fr-gl, .fr-wv { animation: none; } }
    </style>
    <rect width="300" height="120" fill="url(#fr-sky)"/>
    <ellipse cx="150" cy="58" rx="170" ry="13" transform="rotate(-16 150 58)" filter="url(#fr-band)" fill="#EFE3CF" opacity=".08"/>

function goBack() {
