<title>Halcyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap">
<style>
/* Layout: one full-bleed canvas. The threshold, the title, and the three controls float above it. */
:root {
  --ink: #1A1410;
  --umber: #3B2A20;
  --bark: #6B4E3D;
  --clay: #B9805F;
  --peach: #D9A383;
  --gold: #C9A35B;
  --paper: #EFE3CF;
  --tide: #5E7F80;
  --paper-80: rgba(239, 227, 207, 0.8);
  --paper-40: rgba(239, 227, 207, 0.4);
  --paper-15: rgba(239, 227, 207, 0.15);
  --serif: "Cormorant Garamond", "Cormorant", "EB Garamond", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.45, 0, 0.25, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--paper-80);
  font-family: var(--serif);
  font-weight: 300;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

/* ---------- threshold ---------- */
#threshold {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
  background: var(--ink);
  touch-action: none; cursor: default; outline: none;
}
#threshold.open { background: transparent; pointer-events: none; }
#threshold:focus-visible .word { color: var(--paper-80); }
.light { position: relative; width: 120px; height: 120px; display: grid; place-items: center; will-change: transform; }
.light .swell { position: absolute; inset: 0; display: grid; place-items: center; animation: swell 10s ease-in-out infinite; }
.light .halo {
  position: absolute; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201, 163, 91, 0.55) 0%, rgba(201, 163, 91, 0.18) 38%, rgba(201, 163, 91, 0) 70%);
  will-change: transform, opacity;
}
.light .core {
  width: 18px; height: 18px; border-radius: 50%;
  background: #EFD9A8;
  box-shadow: 0 0 24px 8px rgba(201, 163, 91, 0.6);
  will-change: transform, opacity;
}
@keyframes swell { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
#threshold .word {
  font-size: 22px; letter-spacing: 0.12em; color: var(--paper-40);
  transition: color 2s var(--ease);
}

/* ---------- rest light (timer end, sleep fade) ---------- */
#restlight {
  position: fixed; left: 50%; top: 50%; z-index: 15; translate: -50% -50%;
  opacity: 0; pointer-events: none; transition: opacity 4s var(--ease);
}
#restlight.on { opacity: 1; }

/* ---------- scene title ---------- */
#title {
  position: fixed; left: 0; right: 0; top: 26%; z-index: 10;
  text-align: center; pointer-events: none;
  font-size: clamp(22px, 2.6vw, 32px); letter-spacing: 0.12em;
  color: var(--paper-80);
  text-shadow: 0 0 18px rgba(26, 20, 16, 0.55), 0 0 2px rgba(26, 20, 16, 0.4);
  opacity: 0;
}
#title.night { color: var(--gold); }

/* ---------- hold cue on the shore ---------- */
#holdcue {
  position: fixed; z-index: 9; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
  background: radial-gradient(circle, rgba(240, 201, 122, 0.55) 0%, rgba(201, 163, 91, 0) 65%);
  opacity: 0; transform: scale(0.2); pointer-events: none;
}

/* ---------- controls ---------- */
#controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
  padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  opacity: 0; visibility: hidden;
  transition: opacity 0.6s var(--ease), visibility 0s linear 0.6s;
  pointer-events: none;
}
#controls.show { opacity: 1; visibility: visible; transition: opacity 0.6s var(--ease), visibility 0s; }
#controls > * { pointer-events: auto; }
.icons { display: flex; gap: 28px; opacity: 0.7; }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center;
  background: none; border: 0; padding: 0; border-radius: 50%; color: var(--paper); cursor: pointer;
  transition: background-color 0.6s var(--ease);
}
.icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
.icon:hover, .icon[aria-expanded="true"] { background: var(--paper-15); }
.icon:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }

#arc { width: min(520px, 100%); }
#arc svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; cursor: pointer; }
#arc .track { fill: none; stroke: var(--paper-40); stroke-width: 1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
#arc .hit { fill: none; stroke: transparent; stroke-width: 40; }
#arc .end { fill: none; stroke: var(--paper-40); stroke-width: 1; vector-effect: non-scaling-stroke; }
#arc .dot { fill: var(--gold); }
#arc .dotglow { fill: rgba(201, 163, 91, 0.25); }
#arc svg:focus-visible { outline: none; }
#arc svg:focus-visible .dotglow { fill: rgba(201, 163, 91, 0.5); }

#panel {
  width: min(340px, 100%); box-sizing: border-box;
  padding: 18px 20px; border-radius: 6px;
  background: rgba(26, 20, 16, 0.72);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px 18px;
  font-size: 17px; letter-spacing: 0.1em; color: var(--paper-80);
}
#panel .lab { color: var(--paper-40); }
#panel .seg { display: flex; gap: 2px; justify-content: flex-end; }
#panel button {
  font: inherit; letter-spacing: 0.06em; color: var(--paper-80);
  background: none; border: 1px solid transparent; border-radius: 14px;
  padding: 2px 8px; cursor: pointer; font-variant-numeric: tabular-nums;
}
#panel button[aria-pressed="true"] { border-color: var(--gold); color: var(--paper); }
#panel button:focus-visible { outline: 1px solid var(--gold); outline-offset: 1px; }
#panel .sw { justify-self: end; }
#volume { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
#volume::-webkit-slider-runnable-track { height: 1px; background: var(--paper-40); }
#volume::-moz-range-track { height: 1px; background: var(--paper-40); }
#volume::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--gold); border: 0; }
#volume::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); border: 0; }
#volume:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

#loading {
  position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 21;
  text-align: center; font-size: 15px; letter-spacing: 0.12em; color: var(--paper-40);
  transition: opacity 2s var(--ease);
}
#loading.gone { opacity: 0; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .light .swell { animation-duration: 14s; }
}
</style>

<div id="stage" aria-hidden="false"></div>

<div id="threshold" role="button" tabindex="0" aria-label="halcyon. press and hold for one slow breath, then let go to enter.">
  <div class="light" id="tlight">

</div>
<div id="loading" aria-hidden="true"></div>

</div>

      <button type="button" data-min="0" aria-pressed="true">off</button>

  <div id="arc" hidden>
    <svg id="arcsvg" viewBox="0 0 520 112" role="slider" tabindex="0" aria-label="hour" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" aria-valuetext="golden hour">
      <path class="hit" id="archit" d=""></path>
      <path class="track" id="arctrack" d=""></path>
      <circle class="end" cx="20" cy="104" r="3.5"></circle>
      <path class="end" d="M503 99.5a5 5 0 1 0 0 9a4 4 0 0 1 0 -9z"></path>
      <circle class="dotglow" id="arcglow" r="13" cx="0" cy="0"></circle>
      <circle class="dot" id="arcdot" r="5" cx="0" cy="0"></circle>
    </svg>
  </div>

  <div class="icons">
    <button type="button" class="icon" id="b-back" aria-label="back">
      <svg viewBox="0 0 32 32"><rect x="7" y="6" width="18" height="20" rx="3"></rect><path d="M19 16H12M15 13l-3 3 3 3"></path></svg>
    </button>
    <button type="button" class="icon" id="b-hour" aria-label="hour" aria-expanded="false" aria-controls="arc">
      <svg viewBox="0 0 32 32"><path d="M5 22a11 11 0 0 1 22 0"></path><circle cx="21" cy="13.5" r="2" fill="currentColor"></circle><path d="M3 25h26"></path></svg>
    </button>
    <button type="button" class="icon" id="b-rest" aria-label="rest" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 32 32"><path d="M20 6a10 10 0 1 0 6 16A8 8 0 0 1 20 6z"></path></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* =====================================================================
   Halcyon prototype: the threshold and "resting waters".
   Values come from halcyon-design-spec.md. Search "SPEC" for each one.
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const rand = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;

/* ---------- device storage (settings only, SPEC: privacy by default) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('halcyon.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('halcyon.' + k, JSON.stringify(v)); } catch (e) {} }
};

const reduceMotionQuery = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const settings = {
  volume: store.get('volume', 0.7),
  haptics: store.get('haptics', true),
  still: store.get('still', reduceMotionQuery.matches),
  hour: store.get('lake.hour', 0.58)            // SPEC: the lake opens at golden hour
};

/* =====================================================================
   STEP 1 · renderer, film pipeline, ink bleed
   ===================================================================== */
const stage = $('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('loading').textContent = 'this browser cannot draw the scene';
  throw e;
}
renderer.setClearColor(0x1a1410, 1);
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);
renderer.domElement.setAttribute('role', 'img');
renderer.domElement.setAttribute('aria-label', 'resting waters, a lake at golden hour');
renderer.domElement.tabIndex = -1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 1200);
camera.rotation.order = 'YXZ';
const CAM = { x: 0, y: 0.55, z: 6, pitch: -1.2 * DEG };
camera.position.set(CAM.x, CAM.y, CAM.z);
scene.fog = new THREE.Fog(0xC99A7A, 10, 130);

const mirrorCam = new THREE.PerspectiveCamera();
const reflRT = new THREE.WebGLRenderTarget(16, 16, { type: THREE.HalfFloatType });
const texMatrix = new THREE.Matrix4();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.42, 0.5, 0.9); // SPEC: bloom on fire, lanterns, sun, fireflies
composer.addPass(bloom);
composer.addPass(new OutputPass());

const NOISE_GLSL = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash12(i), hash12(i+vec2(1.,0.)), u.x), mix(hash12(i+vec2(0.,1.)), hash12(i+vec2(1.,1.)), u.x), u.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + vec2(1.7, 9.2); a *= .5; } return s; }
`;

/* Film look and ink bleed, after the colour conversion. SPEC: grain 4 %, 24 updates a second, vignette 25 %. */
const FilmShader = {
  uniforms: {
    tDiffuse: { value: null },
    uAspect: { value: 1 },
    uGrainT: { value: 0 },
    uBleed: { value: 0 },
    uCenter: { value: new THREE.Vector2(0.5, 0.5) },
    uCross: { value: 0 },
    uDim: { value: 0 },
    uInk: { value: new THREE.Vector3(26 / 255, 20 / 255, 16 / 255) }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: NOISE_GLSL + /* glsl */`
    uniform sampler2D tDiffuse; uniform float uAspect, uGrainT, uBleed, uCross, uDim; uniform vec2 uCenter; uniform vec3 uInk;
    varying vec2 vUv;
    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      vec2 q = vUv - .5; q.x *= uAspect;
      col *= 1. - .25 * smoothstep(.2, .9, length(q) * 1.15);
      float g = hash12(floor(vUv * vec2(1600., 1600./uAspect)) + uGrainT * vec2(113.1, 71.7)) - .5;
      col += g * .04;
      float m;
      if (uCross > .5) {
        m = uBleed;
      } else {
        vec2 st = vUv * vec2(uAspect, 1.);
        vec2 d = vUv - uCenter; d.x *= uAspect;
        float r = length(d);
        float n1 = fbm(st * 2.6 + 7.3) - .5;
        float n2 = fbm(st * 11. + 1.9) - .5;
        float R = uBleed * 1.75;
        float e = R - (r + n1 * .55 * min(R, .55) + n2 * .07);
        m = smoothstep(-.004, .028, e);
        float settle = 1. - smoothstep(.8, 1., uBleed);
        float rim = exp(-pow((e - .012) / .03, 2.)) * settle;
        col *= 1. - .42 * rim;                                   // pigment gathers at the wet edge
        float paper = vnoise(st * 260.) * .6 + vnoise(st * 70.) * .4;
        col *= mix(1., .82 + .3 * paper, settle * .7);           // paper grain shows for a moment
      }
      col = mix(uInk, col, m);
      col = mix(col, uInk, uDim);
      gl_FragColor = vec4(col, 1.);
    }`
};
const film = new ShaderPass(FilmShader);
composer.addPass(film);

/* =====================================================================
   STEP 2 · the hour: palettes from the mood board strips
   ===================================================================== */
const STOPS = [
  { t: 0.00, top: '#7E8784', hor: '#D6CBB7', glow: '#E9D9BE', sun: '#F3E6CF', sunEl: 1.2, moonEl: -12, star: 0, cloud: .25, cloudCol: '#C9C0AE', deep: '#56625F', fog: '#C9C3B4', hill: '#8E9089', tree: '#4E504A', meadow: '#7F7D6A', land: '#35322B', mist: 1.0, light: .62, sunVis: .55 },
  { t: 0.25, top: '#8EA3A2', hor: '#E8DCC4', glow: '#F2E6CF', sun: '#FFF4DE', sunEl: 36, moonEl: -20, star: 0, cloud: .35, cloudCol: '#EFE3CF', deep: '#4A6667', fog: '#D9D2C0', hill: '#9A9A86', tree: '#4F5040', meadow: '#A39A5C', land: '#45392D', mist: .06, light: 1.0, sunVis: 1 },
  { t: 0.45, top: '#7C8F8E', hor: '#EAD3AE', glow: '#F2DDB6', sun: '#FBEBCB', sunEl: 15, moonEl: -20, star: 0, cloud: .3, cloudCol: '#EBD6B4', deep: '#465A5B', fog: '#DCC9A8', hill: '#94876E', tree: '#4A4033', meadow: '#A08A5E', land: '#40332A', mist: .06, light: .92, sunVis: 1 },
  { t: 0.58, top: '#4A3528', hor: '#EBC9A0', glow: '#D9A383', sun: '#F6E8CC', sunEl: 4, moonEl: -16, star: 0, cloud: .45, cloudCol: '#D9A383', deep: '#33403F', fog: '#C99A7A', hill: '#8A6450', tree: '#3B2A20', meadow: '#8E6A4C', land: '#2A1F18', mist: .14, light: .76, sunVis: 1 },
  { t: 0.72, top: '#2B2530', hor: '#B9805F', glow: '#B9805F', sun: '#E8B48A', sunEl: -2.5, moonEl: 1, star: .22, cloud: .4, cloudCol: '#8A5A48', deep: '#222A29', fog: '#7A5546', hill: '#4E3A33', tree: '#231A15', meadow: '#4A3529', land: '#1B1410', mist: .3, light: .42, sunVis: .45 },
  { t: 0.86, top: '#0E1416', hor: '#1F2C30', glow: '#2A3A3C', sun: '#3A3A3A', sunEl: -14, moonEl: 9, star: .8, cloud: .15, cloudCol: '#26302F', deep: '#0F1516', fog: '#1C2629', hill: '#1A2224', tree: '#0E1213', meadow: '#161C1C', land: '#0B0E0E', mist: .22, light: .24, sunVis: 0 },
  { t: 1.00, top: '#07090A', hor: '#15201F', glow: '#1E2A2B', sun: '#222222', sunEl: -22, moonEl: 19, star: 1, cloud: .1, cloudCol: '#1A2223', deep: '#0A0E0F', fog: '#141C1E', hill: '#121819', tree: '#0A0D0E', meadow: '#0F1313', land: '#08090A', mist: .2, light: .17, sunVis: 0 }
];
const COLOR_KEYS = ['top', 'hor', 'glow', 'sun', 'cloudCol', 'deep', 'fog', 'hill', 'tree', 'meadow', 'land'];
const NUM_KEYS = ['sunEl', 'moonEl', 'star', 'cloud', 'mist', 'light', 'sunVis'];
for (const s of STOPS) for (const k of COLOR_KEYS) s[k] = new THREE.Color(s[k]);
const env = {}; for (const k of COLOR_KEYS) env[k] = new THREE.Color();
const SUN_AZ = 0.24, MOON_AZ = -0.16;
env.sunDir = new THREE.Vector3(); env.moonDir = new THREE.Vector3();
function dirFrom(az, el) { return new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)); }
function sampleHour(h) {
  let i = 0; while (i < STOPS.length - 2 && h > STOPS[i + 1].t) i++;
  const a = STOPS[i], b = STOPS[i + 1];
  const t = easeIO(clamp((h - a.t) / (b.t - a.t), 0, 1));
  for (const k of COLOR_KEYS) env[k].copy(a[k]).lerp(b[k], t);
  for (const k of NUM_KEYS) env[k] = lerp(a[k], b[k], t);
  env.sunDir.copy(dirFrom(SUN_AZ, env.sunEl * DEG));
  env.moonDir.copy(dirFrom(MOON_AZ, env.moonEl * DEG));
  env.moon = smooth(-2, 4, env.moonEl);
  env.night = smooth(0.66, 0.84, h);
}
function hourName(h) {
  if (h < 0.12) return 'dawn';
  if (h < 0.38) return 'midday';
  if (h < 0.52) return 'afternoon';
  if (h < 0.65) return 'golden hour';
  if (h < 0.79) return 'dusk';
  return 'night';
}

/* =====================================================================
   STEP 3 · sky, far shore, water
   ===================================================================== */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: { value: env.top }, uHor: { value: env.hor }, uGlow: { value: env.glow }, uSunCol: { value: env.sun },
    uSunDir: { value: env.sunDir }, uMoonDir: { value: env.moonDir }, uSunVis: { value: 1 }, uMoon: { value: 0 },
    uStar: { value: 0 }, uCloud: { value: 0 }, uCloudCol: { value: env.cloudCol }, uMist: { value: 0 }, uFog: { value: env.fog }, uTime: { value: 0 }
  },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; gl_Position.z = gl_Position.w; }`,
  fragmentShader: NOISE_GLSL + /* glsl */`
    uniform vec3 uTop, uHor, uGlow, uSunCol, uSunDir, uMoonDir, uCloudCol, uFog;

    pool.items.forEach((p, i) => {

        pool.alpha[i] = blink * smooth(0, 0.08, f) * (1 - smooth(0.85, 1, f));

/* SPEC: when the tab is hidden, rendering stops and the sound fades out over 2 s. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) sound.fadeTo(0, 2);
  else { last = performance.now(); if (state === 'scene' && !resting) sound.fadeTo(1, 3); }
});

resize();
applyEnv();
// warm the shaders once so the first breath out does not stutter
updateMirror(); renderer.setRenderTarget(reflRT); renderer.render(scene, mirrorCam); renderer.setRenderTarget(null); composer.render();
requestAnimationFrame(frame);
window.__halcyon = { setHour: (h) => { setHourTarget(h); hour = h; }, enter: () => { breath.b = 1; openThreshold(); }, kingfisher: () => kingfisherArrive(), state: () => state, lanterns, spawnLantern, ripple, fireflies };
</script>
